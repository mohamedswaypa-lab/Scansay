:root{--ink:#0F1013;--muted:#5B5B66;--line:#E4E4E9;--bg:#F4F4F6;--card:#fff;--black:#0F1013;--lime:#1D4ED8;--soft:#F6F6F8;--limeink:#1E40AF;--bad:#b42318;--badbg:#fdecea;--warn:#8a5a00;--warnbg:#fff4d6;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px;border-radius:6px}
header{background:var(--black);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:3px solid var(--lime);position:sticky;top:0;z-index:10;flex-wrap:wrap}
.logo{display:flex;gap:10px;align-items:center}
.wm{display:block;font-weight:800;font-size:19px;letter-spacing:-.04em;line-height:1}.wm span{color:var(--lime)}
.slg{display:block;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:600;font-size:12.5px;color:#E4E4E7;margin:2px 0 1px}.slg em{color:var(--lime)}
.logo small{display:block;color:#9CA3AF;font-size:11.5px;font-weight:600}
.hright{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:#D6CEBB}
.hright .who{background:#18191E;border:1px solid rgba(201,162,39,.35);border-radius:999px;padding:6px 12px;font-weight:700}
nav{display:flex;gap:6px;padding:14px 20px 0;max-width:1320px;margin:0 auto;overflow-x:auto}
nav button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-weight:700;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--black);color:#fff;border-color:var(--black);box-shadow:inset 0 -3px 0 var(--lime)}
nav .cnt{background:var(--lime);color:var(--black);border-radius:999px;font-size:11px;padding:0 7px;margin-left:5px}
main{max-width:1320px;margin:0 auto;padding:16px 20px 60px}
h1{font-size:22px;margin:0}h2{font-size:15px;margin:0 0 12px}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.grid{display:grid;gap:14px}.g6{grid-template-columns:repeat(6,1fr)}.g2{grid-template-columns:1fr 1fr}.g32{grid-template-columns:1.6fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.kpi{border-top:4px solid var(--lime)}.kpi small{color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.kpi b{display:block;font-size:27px;letter-spacing:-.03em;margin:2px 0;font-variant-numeric:tabular-nums}.kpi em{font-style:normal;font-size:12.5px;color:var(--muted)}.kpi em.up{color:var(--limeink);font-weight:700}
.kpi.dark{background:var(--black);color:#fff;border-color:var(--black)}.kpi.dark small,.kpi.dark em{color:#D6CEBB}.kpi.dark b{color:var(--lime)}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid #EFEFF2;vertical-align:middle}tr.click{cursor:pointer}tr.click:hover{background:#FBFBFC}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:#EFEFF2}
.t-on{background:var(--soft);color:#1D4ED8}.t-pilot{background:var(--black);color:var(--lime)}.t-off{background:#EFEFF2;color:#6A6457}.t-bad{background:var(--badbg);color:var(--bad)}.t-warn{background:var(--warnbg);color:var(--warn)}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;background:var(--black);color:#fff}
.btn.lime{background:linear-gradient(135deg,#BFDBFE,#FFC97A 30%,#3B82F6 62%,#B07D10);color:var(--black)}.btn.line{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.red{background:var(--bad)}.btn.sm{padding:6px 10px;font-size:12.5px}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.seg{display:inline-flex;background:#EEE9DD;border-radius:999px;padding:3px}.seg button{border:0;background:none;border-radius:999px;padding:5px 12px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--muted)}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.todo{display:grid;gap:8px}.todo div{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.todo i{width:10px;height:10px;border-radius:50%;flex:none}.todo b{flex:1;font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bar{height:8px;background:#EEE9DD;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:var(--lime)}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:30}.drawer.show{display:block}
.drawer .pane{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:#fff;overflow:auto;padding:20px;box-shadow:-20px 0 50px rgba(0,0,0,.25)}
label.sub{display:grid;gap:4px;font-weight:600}.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13.5px}.kv span{color:var(--muted)}
.secl{display:grid;gap:6px}.secl>div{border:1px solid var(--line);border-radius:10px;padding:8px 10px}.secl small{color:var(--muted)}
.chipsm{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.chipsm span{font-size:11.5px;background:var(--soft);border-radius:999px;padding:1px 8px;color:#1D4ED8}
.cat{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:#fff}
.cat>b{font-size:15px}
.ind{border-top:1px solid #EFEFF2;padding:10px 0}
.ok{color:var(--limeink);font-weight:700}.no{color:var(--bad);font-weight:700}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);opacity:0;pointer-events:none;background:var(--black);color:#fff;border-left:4px solid var(--lime);padding:11px 16px;border-radius:12px;font-weight:600;transition:transform .25s;z-index:40}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.note{background:var(--warnbg);border:1px solid #e9d27a;color:#5c4a05;border-radius:12px;padding:10px 12px;font-size:13px}
@media (max-width:1100px){.g6{grid-template-columns:repeat(3,1fr)}.g32,.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr}}
@media (max-width:640px){.g6{grid-template-columns:1fr 1fr}.hide{display:none}.kv{grid-template-columns:1fr}}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tier small{font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.tier .sc{background:#F6F6F8;border-radius:10px;padding:8px 10px;margin:10px 0 6px}.tier .sc span{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase}.tier ul{padding-left:18px;margin:6px 0 0;font-size:13px;display:grid;gap:4px}
.tier.ent{background:#0F1013;color:#E4E4E7;border-color:#0F1013}.tier.ent .sc{background:#18191E}.tier.ent small{color:#2563EB}.tier.ent .sub{color:#9CA3AF}.tier.ent input{color:#0F1013;background:#fff}
.tagc{font-size:12px;font-weight:800;color:#1D4ED8}.tier.ent .tagc{color:#2563EB}
.tpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tpick button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px;text-align:left;cursor:pointer;display:grid;gap:3px}.tpick button span{font-weight:800;color:#1D4ED8}.tpick button small{font-size:11.5px;color:var(--muted);line-height:1.3}.tpick button.on{border-color:#1D4ED8;background:#EFF6FF;box-shadow:inset 0 0 0 1.5px #1D4ED8}
.chipsm label.ck{display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:700;cursor:pointer}.chipsm label.ck.on{border-color:#1D4ED8;background:#EFF6FF}.chipsm .own{background:#0F1013!important;color:#2563EB!important}.chipsm .own a{color:#fff;text-decoration:none;margin-left:4px}
.offer{border:1px solid var(--line);border-radius:14px;padding:18px;background:#fff;position:relative}.offer:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;border-radius:14px 14px 0 0;background:linear-gradient(90deg,#2563EB,#3B82F6,#1D4ED8)}
.ohd{display:flex;align-items:center;gap:8px;margin-bottom:10px}.ohd b{font-size:17px}.ohd span{margin-left:auto;color:var(--muted);font-size:12.5px}.offer h3{margin:6px 0 2px}.offer table{margin-top:10px}.offer td{font-size:13px;vertical-align:top}.offer td:first-child{font-weight:800;width:110px;color:var(--muted)}
.osig{margin-top:14px;display:grid}.sigx{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:600;font-size:22px}.osig span:last-child{font-size:12.5px;color:var(--muted)}
@media(max-width:1000px){.tiers,.tpick{grid-template-columns:1fr 1fr}}
</style>

/* ---------- charts ---------- */
function ring(p,col,txt,size=64){const r=(size-10)/2,c=2*Math.PI*r,v=Math.max(0,Math.min(100,p));return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#25262D" stroke-width="7"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 ${size/2} ${size/2})" style="filter:drop-shadow(0 0 4px ${col}88)"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="${size*.2}" font-weight="800">${txt}</text></svg>`}
function donut(segs,center,sub){const R=70,r=46,cx=90,cy=90;let a=-Math.PI/2;const tot=segs.reduce((s,x)=>s+x[1],0)||1;
  const arcs=segs.map(([l,v,c])=>{const a2=a+v/tot*Math.PI*2-0.02;const p=(rr,an)=>[cx+rr*Math.cos(an),cy+rr*Math.sin(an)];const [x1,y1]=p(R,a),[x2,y2]=p(R,a2),[x3,y3]=p(r,a2),[x4,y4]=p(r,a);const lg=a2-a>Math.PI?1:0;
    const d=`M${x1} ${y1}A${R} ${R} 0 ${lg} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${lg} 0 ${x4} ${y4}Z`;a=a2+0.02;return `<path d="${d}" fill="${c}"/>`}).join('');
  return `<svg viewBox="0 0 180 180" width="180" height="180">${arcs}<text x="90" y="86" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">${center}</text><text x="90" y="106" text-anchor="middle" fill="#8B8B95" font-size="10.5" font-weight="700">${sub}</text></svg>`}
function linechart(vals,labels,col,fmt){const W=520,H=210,p=30,mx=Math.max(...vals)*1.15||1;const X=i=>p+i*(W-p*2)/(vals.length-1),Y=v=>H-p-v/mx*(H-p*2);
  const pts=vals.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');const area=`M${X(0)},${H-p} L${pts.replace(/ /g,' L')} L${X(vals.length-1)},${H-p}Z`;const pk=vals.indexOf(Math.max(...vals));
  const grid=[.25,.5,.75,1].map(f=>`<line x1="${p}" x2="${W-p}" y1="${Y(mx/1.15*f)}" y2="${Y(mx/1.15*f)}" stroke="#25262D"/><text x="${p-6}" y="${Y(mx/1.15*f)+3}" fill="#8B8B95" font-size="9" text-anchor="end">${fmt(mx/1.15*f)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%"><defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".45"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#lg1)"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" style="filter:drop-shadow(0 0 6px ${col})"/>

function stacked(rows,labels,cols){const W=380,H=210,p=26,bw=(W-p*2)/rows.length*.62;

  ${rows.map((r,i)=>{const tot=r.reduce((s,x)=>s+x,0)||1;let y=H-p;const x=p+i*(W-p*2)/rows.length+((W-p*2)/rows.length-bw)/2;return r.map((v,k)=>{const h=v/tot*(H-p*2);y-=h;return `<rect x="${x}" y="${y}" width="${bw}" height="${h-1.5}" rx="3" fill="${cols[k]}"/>${h>16?`<text x="${x+bw/2}" y="${y+h/2+3}" fill="#0F1013" font-size="9" font-weight="800" text-anchor="middle">${Math.round(v/tot*100)}%</text>`:''}`}).join('')+`<text x="${x+bw/2}" y="${H-8}" fill="#8B8B95" font-size="9.5" text-anchor="middle">${labels[i]}</text>`}).join('')}</svg>`}

function combo(lab,rev,vol){const W=640,H=220,p=34,mx=Math.max(1,...rev),mv=Math.max(1,...vol),bw=(W-p*2)/lab.length;

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${[0,.5,1].map(f=>`<line x1="${p}" x2="${W-p}" y1="${H-p-(H-p*2)*f}" y2="${H-p-(H-p*2)*f}" stroke="#EEE9DD"/><text x="${p-6}" y="${H-p-(H-p*2)*f+4}" font-size="10" fill="#7A7466" text-anchor="end">${Math.round(mx*f/1000)}k</text>`).join('')}
   ${rev.map((v,i)=>`<rect x="${p+i*bw+bw*.18}" y="${H-p-(H-p*2)*v/mx}" width="${bw*.64}" height="${(H-p*2)*v/mx}" rx="4" fill="#1D4ED8"><title>${lab[i]}: ${kr(v)}</title></rect><text x="${p+i*bw+bw/2}" y="${H-12}" font-size="10" fill="#7A7466" text-anchor="middle">${lab[i]}</text>`).join('')}
   <polyline points="${pts}" fill="none" stroke="#0F1013" stroke-width="2.2"/>${vol.map((v,i)=>`<circle cx="${p+i*bw+bw/2}" cy="${H-p-(H-p*2)*v/mv}" r="3" fill="#0F1013"/>`).join('')}</svg>`}

/* ---------- templates ---------- */
let TC='hospitality';
function tpl(){const C=TP.CAT[TC];return `<h1>Branscher och mallar</h1><div class="sub" style="margin-bottom:12px">Sektioner och frågor som nya konton får. Varje fråga styr statistiken och AI-sammanfattningen.</div>
  <div class="row" style="margin-bottom:12px"><div class="seg">${Object.entries(TP.CAT).map(([k,c])=>`<button class="${TC===k?'on':''}" onclick="TC='${k}';render()">${esc(trs(c.n))}</button>`).join('')}</div></div>
  <div class="grid g2">${Object.entries(C.ind).map(([ik,I])=>`<div class="cat"><div class="row between"><b>${esc(trs(I.n))}</b><span class="sub">${S.accounts.filter(a=>a.ind===ik).length} konton · ${I.sec.length} sektioner</span></div>
   ${I.sec.map(s=>`<div class="ind"><div class="row between"><b>${esc(trs(s.n))}</b><span class="sub">Snabbfråga: ${esc(trs(TP.QUICK(s.k)))}</span></div><div class="chipsm">${s.t.map(t=>`<span>${esc(trs(t))}</span>`).join('')}</div></div>`).join('')}</div>`).join('')}</div>`}
/* ---------- GDPR ---------- */
function gdpr(){const miss=S.accounts.filter(a=>!a.dpa);
  return `<h1>GDPR och avtal</h1><div class="sub" style="margin-bottom:12px">Biträdesavtal, registerförfrågningar och underbiträden</div>
  <div class="grid g6" style="margin-bottom:14px"><div class="card kpi"><small>Biträdesavtal</small><b>${S.accounts.length-miss.length}/${S.accounts.length}</b><em>${miss.length?miss.length+' saknas':'Alla signerade'}</em></div>
   <div class="card kpi"><small>Förfrågningar</small><b>${S.reqs.length}</b><em>${S.reqs.filter(r=>r.status!=='Klar').length} pågår</em></div><div class="card kpi"><small>Svarstid</small><b>${Math.round(S.reqs.reduce((s,r)=>s+r.days,0)/S.reqs.length)} d</b><em>krav: inom 30 dagar</em></div>
   <div class="card kpi"><small>Incidenter</small><b>0</b><em>senaste 12 månaderna</em></div><div class="card kpi"><small>Lagring</small><b>EU</b><em>alla underbiträden</em></div><div class="card kpi"><small>MBL-spärr</small><b>${S.accounts.filter(a=>a.mbl).length}</b><em>konton med namngiven statistik</em></div></div>
  <div class="grid g2"><div class="card"><h2>Saknar biträdesavtal</h2>${miss.length?`<table><tbody>${miss.map(a=>`<tr><td><b>${esc(a.name)}</b><div class="sub">${esc(a.email)}</div></td><td><button class="btn sm" onclick="OPEN='${a.id}';dpa2('${a.id}')">Markera signerat</button></td></tr>`).join('')}</tbody></table><div class="note" style="margin-top:10px">Inga personuppgifter ska behandlas innan avtalet är signerat.</div>`:'<div class="sub">Alla konton har signerat.</div>'}</div>
   <div class="card"><h2>Registerförfrågningar</h2><table><thead><tr><th>Datum</th><th>Typ</th><th>Konto</th><th>Status</th></tr></thead><tbody>${S.reqs.map(r=>`<tr><td>${fmtD(r.ts)}</td><td>${r.type}</td><td>${esc((S.accounts.find(a=>a.id===r.acc)||{name:'–'}).name)}</td><td><span class="tag ${r.status==='Klar'?'t-on':'t-warn'}">${r.status}</span></td></tr>`).join('')}</tbody></table></div></div>
  <div class="grid g2" style="margin-top:14px"><div class="card"><h2>Dokument</h2><table><tbody>${[['Konsekvensbedömning (DPIA): kundfeedback','Klar · låt jurist granska','t-on','docs/dpia-feedback.html'],['Konsekvensbedömning (DPIA): personalinloggning och incheckning','Klar · låt jurist granska','t-on','docs/dpia-staff.html'],['Registerförteckning (ROPA)','Klar · fyll i org.nr','t-on','docs/ropa.html'],['Allmänna villkor med skydd mot återkrav','Klar · låt jurist granska','t-on','../legal/villkor.html'],['Personuppgiftsbiträdesavtal (PUB)','Klar · fyll i underbiträden','t-on','../legal/pub-avtal.html'],['AI-policy: EU, ingen träning, lagring 30 dagar','Publicerad','t-on',''],['Lagringspolicy: rådata 12 mån, anonym statistik 3 år','Publicerad','t-on',''],['Incidentrutin: IMY inom 72 h, kund inom 24 h','Publicerad','t-on',''],['Mall: MBL-information till fack och personal','Klar','t-on','docs/mbl.html']].map(x=>`<tr><td>${x[3]?`<a href="${x[3]}" target="_blank" rel="noopener">${x[0]}</a>`:x[0]}</td><td><span class="tag ${x[2]}">${x[1]}</span></td></tr>`).join('')}</tbody></table></div>
   <div class="card"><h2>Incidenter</h2><div class="sub" style="margin-bottom:8px">Inga incidenter senaste 12 månaderna.</div><div class="kv"><span>Upptäckt till IMY</span><b>Senast 72 timmar</b><span>Kund underrättas</span><b>Inom 24 timmar</b><span>Mall</span><b>Klar för incidentanmälan</b><span>Senaste övning</span><b>${fmtD(NOW-41*864e5)}</b></div></div></div>
  <div class="card" style="margin-top:14px"><h2>Underbiträden</h2><table><thead><tr><th>Tjänst</th><th>Plats</th><th>Biträdesavtal</th></tr></thead><tbody>${[['Drift och lagring','EU (Sverige)'],['E-post','EU'],['SMS','EU'],['AI-sammanfattningar och svarsförslag','EU · ingen träning på data']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td><span class="tag t-on">Signerat</span></td></tr>`).join('')}</tbody></table></div>`}
function dpa2(id){const a=S.accounts.find(x=>x.id===id);a.dpa=NOW.getTime();save();render();toast('Biträdesavtal markerat för '+a.name)}
/* ---------- system ---------- */
function sys(){return `<h1>System</h1><div class="sub" style="margin-bottom:12px">Drift, leveranser och säkerhet</div>
  <div class="grid g2"><div class="card"><h2>Status</h2><div class="todo">${S.sys.map(s=>`<div><i style="background:${s.s==='ok'?'#2563EB':'#e9b308'}"></i><b>${esc(s.n)}</b><span class="sub">${esc(s.d)}</span></div>`).join('')}</div></div>
   <div class="card"><h2>Säkerhet</h2><div class="kv"><span>Tvåstegsverifiering</span><b class="ok">På för alla administratörer</b><span>Kryptering</span><b>TLS 1.2+ · AES-256 i lagring</b><span>Åtkomstlogg</span><b>Sparas 12 månader</b><span>Incidentrutin</span><b>Kund underrättas inom 24 h</b><span>Senaste sårbarhetsskanning</span><b>${fmtD(NOW-3*864e5)}</b></div></div></div>
  <div class="grid g6" style="margin-top:14px"><div class="card kpi"><small>Drifttid 30 d</small><b>99,96 %</b><em>mål 99,9 %</em></div><div class="card kpi"><small>Svarstid API</small><b>142 ms</b><em>median</em></div><div class="card kpi"><small>E-post levererad</small><b>99,2 %</b><em>SPF, DKIM, DMARC</em></div><div class="card kpi"><small>SMS levererade</small><b>99,7 %</b><em>reserv: e-post och notis</em></div><div class="card kpi"><small>Fel 24 h</small><b>3</b><em>i felövervakningen</em></div><div class="card kpi"><small>Tillgänglighet</small><b>AA</b><em>WCAG 2.1, formulär granskat</em></div></div>
  <div class="card" style="margin-top:14px"><h2>Händelselogg</h2><table><tbody>${S.log.map(l=>`<tr><td class="sub" style="width:150px">${fmtD(l.t)}</td><td>${esc(l.txt)}</td></tr>`).join('')}</tbody></table></div>
  <div class="row" style="margin-top:14px"><button class="btn line" onclick="if(confirmReset){localStorage.removeItem(KEY);S=seed();save();render();toast('Demodata återställd')}else{confirmReset=true;toast('Klicka igen för att återställa demodata')}">Återställ demodata</button></div>`}
let confirmReset=false;
addEventListener('keydown',e=>{if(e.key==='Escape')closeD()});
render();
</script>

.btn.lime,.btn.aib,.btn.sn,.lime,.aib,.sn{background:#1D4ED8!important;color:#fff!important}.lime:hover,.aib:hover,.sn:hover{background:#1E40AF!important}
.on{background:#2563EB!important;color:#0F1013!important;box-shadow:none!important}</style><style id="case-fix">*{text-transform:none!important}</style><style id="dash-fix2">.logo .wm{display:inline-flex!important;align-items:center;gap:0;font-size:22px!important;line-height:1}.logo .wm svg{width:32px!important;height:32px!important;flex:none;margin:0 9px 0 0}.logo .wm>span:not(.say){color:#fff!important;background:none!important;-webkit-text-fill-color:#fff!important}.logo .wm>.say{color:#3B82F6!important;-webkit-text-fill-color:#3B82F6!important;background:none!important}.kpi small{display:block;padding-right:46px}</style><style>body{background:radial-gradient(900px 500px at 85% -10%,rgba(37,99,235,.10),transparent 60%),radial-gradient(800px 600px at 10% 110%,rgba(59,130,246,.10),transparent 60%),#0B0B0E!important;background-attachment:fixed!important}header{background:rgba(15,16,19,.82)!important;backdrop-filter:blur(14px)}.card{border-radius:20px!important}</style><script id="navfit">(function(){function f(){var h=document.querySelector("header"),n=document.getElementById("nav");if(!h||!n)return;if(getComputedStyle(n).position==="fixed")n.style.setProperty("top",h.getBoundingClientRect().height+"px","important");else n.style.removeProperty("top")}addEventListener("load",f);addEventListener("resize",f);setTimeout(f,300);setInterval(f,2000)})();</script></body>
