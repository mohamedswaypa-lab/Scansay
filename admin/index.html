<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ScanSay Admin</title>
<link rel="icon" href="../brand/scansay-icon.svg" type="image/svg+xml">
<style>
@font-face{font-family:J;src:url(../fonts/jakarta-400.woff2) format('woff2');font-weight:400}
@font-face{font-family:J;src:url(../fonts/jakarta-600.woff2) format('woff2');font-weight:600}
@font-face{font-family:J;src:url(../fonts/jakarta-700.woff2) format('woff2');font-weight:700}
@font-face{font-family:J;src:url(../fonts/jakarta-800.woff2) format('woff2');font-weight:800}
:root{--g0:#0B0B0E;--g1:#0F1013;--g2:#141519;--g3:#18191E;--g4:#1E1F25;--g5:#25262D;--g6:#2E2F37;
 --tx:#ECECEF;--tx2:#A1A1AA;--tx3:#71717A;--hair:rgba(255,255,255,.08);--hair2:rgba(255,255,255,.14);
 --or:#FF7A45;--pk:#FF3D77;--am:#FFB547;--pri:#E5384B;--ok:#34D399;--warn:#FBBF24;--bad:#F87171;--info:#60A5FA;
 --sun:linear-gradient(135deg,#FF7A45,#FF3D77);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:J,system-ui,sans-serif;font-size:14.5px;line-height:1.5;color:var(--tx);background:radial-gradient(900px 500px at 90% -10%,rgba(255,122,69,.1),transparent 60%),radial-gradient(800px 600px at 0% 110%,rgba(255,61,119,.08),transparent 60%),var(--g1);background-attachment:fixed;min-height:100vh}
a{color:var(--or)}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:28px;letter-spacing:-.03em;margin:0}h2{font-size:17px;margin:0 0 12px;letter-spacing:-.01em}h3{font-size:15px;margin:0}
.sub{color:var(--tx2);font-size:13.5px}
/* layout */
.top{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;gap:16px;padding:0 20px;background:rgba(11,11,14,.82);backdrop-filter:blur(16px);border-bottom:1px solid var(--hair)}
.top:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,#FF7A45 25%,#FF3D77 75%,transparent);opacity:.7;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;min-width:208px}
.brand svg{width:32px;height:32px;filter:drop-shadow(0 6px 14px rgba(255,61,119,.35))}
.brand b{font-size:21px;font-weight:800;letter-spacing:-.045em}.brand b span{background:var(--sun);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:11px;color:var(--am);font-weight:700;letter-spacing:.04em;margin-top:1px}
.gsearch{flex:1;max-width:520px;position:relative}
.gsearch input{width:100%;background:var(--g3);border:1px solid var(--hair2);border-radius:999px;padding:10px 16px 10px 40px;outline:0}
.gsearch input:focus{border-color:rgba(255,122,69,.6);box-shadow:0 0 0 4px rgba(255,122,69,.12)}
.gsearch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--tx3)}
.gres{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--g3);border:1px solid var(--hair2);border-radius:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.8);padding:6px;display:none;max-height:380px;overflow:auto}
.gres.on{display:block}.gres button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:10px;cursor:pointer}.gres button:hover{background:var(--g5)}
.gres small{color:var(--tx3)}
.tright{margin-left:auto;display:flex;align-items:center;gap:10px}
.who{display:flex;align-items:center;gap:8px;background:var(--g3);border:1px solid var(--hair);border-radius:999px;padding:4px 12px 4px 4px;font-weight:700;font-size:13px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;flex:none}
.side{position:fixed;top:64px;bottom:0;left:0;width:236px;padding:14px 12px;border-right:1px solid var(--hair);background:rgba(11,11,14,.6);overflow:auto;z-index:20}
.side button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--tx2);padding:9px 10px;border-radius:12px;cursor:pointer;font-weight:600;text-align:left;margin-bottom:2px}
.side button .ni{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.05);flex:none}
.side button:hover{background:rgba(255,255,255,.05);color:#fff}
.side button.on{background:var(--pri);color:#fff;box-shadow:0 12px 26px -14px rgba(229,56,75,.9)}.side button.on .ni{background:rgba(255,255,255,.18)}
.side .cnt{margin-left:auto;background:var(--pk);color:#fff;border-radius:999px;font-size:11.5px;font-weight:800;padding:1px 8px}
.side .grp{font-size:11px;font-weight:800;color:var(--tx3);letter-spacing:.08em;text-transform:uppercase;margin:14px 10px 6px}
.side .ext{color:var(--am)}
main{margin-left:236px;padding:24px 26px 60px;max-width:1500px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
/* components */
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.card{background:var(--g3);border:1px solid var(--hair);border-radius:20px;padding:18px}
.kpi{position:relative;overflow:hidden}
.kpi small{display:block;color:var(--tx2);font-weight:600;font-size:12.5px;padding-right:40px}
.kpi b{display:block;font-size:28px;letter-spacing:-.03em;font-weight:800;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12.5px;font-weight:700;color:var(--tx3)}.kpi em.up{color:var(--ok)}.kpi em.dn{color:var(--bad)}
.kpi .ki{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(255,122,69,.14);color:var(--or)}
.kpi.hero{background:linear-gradient(135deg,rgba(255,122,69,.22),rgba(255,61,119,.18)),var(--g3);border-color:rgba(255,122,69,.3)}
.kpi.hero b{font-size:32px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--hair2);background:var(--g4);color:#fff;border-radius:999px;padding:9px 16px;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--g5)}
.btn.pri{background:var(--pri);border-color:var(--pri);box-shadow:0 10px 24px -12px rgba(229,56,75,.9)}.btn.pri:hover{background:#C92A3E}
.btn.ghost{background:transparent}.btn.danger{border-color:rgba(248,113,113,.4);color:#FCA5A5;background:rgba(248,113,113,.08)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-weight:800;font-size:11.5px;white-space:nowrap}
.t-ok{background:rgba(52,211,153,.14);color:#6EE7B7}.t-warn{background:rgba(251,191,36,.14);color:#FCD34D}.t-bad{background:rgba(248,113,113,.14);color:#FCA5A5}.t-info{background:rgba(96,165,250,.14);color:#93C5FD}.t-mut{background:rgba(255,255,255,.07);color:var(--tx2)}.t-sun{background:rgba(255,122,69,.16);color:#FFB59A}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:700;color:var(--tx3);padding:10px 12px;border-bottom:1px solid var(--hair2);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--hair);vertical-align:middle}
tr:last-child td{border-bottom:0}tbody tr.click{cursor:pointer}tbody tr.click:hover td{background:rgba(255,255,255,.03)}
td b{font-weight:700}.num{font-variant-numeric:tabular-nums;text-align:right}
input.f,select.f,textarea.f{background:var(--g4);border:1px solid var(--hair2);border-radius:12px;padding:10px 12px;outline:0;width:100%}
input.f:focus,select.f:focus,textarea.f:focus{border-color:rgba(255,122,69,.6);box-shadow:0 0 0 4px rgba(255,122,69,.12)}
label.l{display:block;font-size:12.5px;font-weight:700;color:var(--tx2);margin:12px 0 6px}
.seg{display:inline-flex;background:var(--g4);border:1px solid var(--hair);border-radius:999px;padding:3px}
.seg button{background:none;border:0;color:var(--tx2);padding:7px 14px;border-radius:999px;font-weight:700;cursor:pointer;font-size:13px}.seg button.on{background:var(--sun);color:#fff}
.pick{display:grid;gap:8px}.pick.c4{grid-template-columns:repeat(4,1fr)}.pick.c2{grid-template-columns:repeat(2,1fr)}
.pick button{background:var(--g4);border:1px solid var(--hair2);border-radius:14px;padding:12px;text-align:left;cursor:pointer;color:var(--tx)}
.pick button b{display:block;font-size:14px}.pick button small{color:var(--tx3);font-size:12px}
.pick button.on{border-color:var(--or);background:rgba(255,122,69,.1);box-shadow:0 0 0 3px rgba(255,122,69,.15)}
.chk{display:flex;align-items:center;gap:10px;background:var(--g4);border:1px solid var(--hair2);border-radius:12px;padding:9px 12px;cursor:pointer}
.chk.on{border-color:var(--or);background:rgba(255,122,69,.1)}
.chk input{accent-color:#FF7A45;width:16px;height:16px}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.switch i{width:40px;height:22px;border-radius:999px;background:var(--g6);position:relative;transition:.2s;flex:none}
.switch i:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch.on i{background:var(--sun)}.switch.on i:after{left:21px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}.kv span{color:var(--tx3)}
.empty{color:var(--tx3);text-align:center;padding:30px}
/* drawer + modal */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:60;display:none}.dim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--g2);border-left:1px solid var(--hair2);z-index:70;transform:translateX(105%);transition:transform .25s;overflow:auto;padding:24px;box-shadow:-30px 0 60px -30px rgba(0,0,0,.8)}
.drawer.on{transform:none}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);width:min(440px,92vw);background:var(--g3);border:1px solid var(--hair2);border-radius:20px;padding:22px;z-index:80;opacity:0;pointer-events:none;transition:.15s}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--g5);border:1px solid var(--hair2);color:#fff;border-radius:14px;padding:12px 18px;font-weight:700;opacity:0;transition:.25s;z-index:90;box-shadow:0 20px 40px -20px rgba(0,0,0,.8)}
.toast.on{opacity:1;transform:translateX(-50%)}
.sum{background:linear-gradient(135deg,rgba(255,122,69,.14),rgba(255,61,119,.1));border:1px solid rgba(255,122,69,.3);border-radius:16px;padding:14px 16px;margin-top:14px}
.sum b.big{font-size:26px;letter-spacing:-.03em}
.feed li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:13.5px}.feed li:last-child{border:0}.feed{list-style:none;margin:0;padding:0}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
/* messages */
.msgwrap{display:grid;grid-template-columns:320px 1fr;gap:14px;height:calc(100vh - 190px);min-height:520px}
.thl{overflow:auto;padding:8px}.th{display:block;width:100%;text-align:left;background:none;border:0;border-radius:14px;padding:12px;cursor:pointer;color:var(--tx)}
.th:hover{background:var(--g4)}.th.on{background:var(--g5)}.th b{display:block}.th small{color:var(--tx3)}.th .un{float:right;background:var(--pk);color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:0 7px}
.conv{display:flex;flex-direction:column;padding:0;overflow:hidden}.convh{padding:16px 18px;border-bottom:1px solid var(--hair)}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:72%;padding:10px 14px;border-radius:16px;background:var(--g5);font-size:14px}.bub.me{align-self:flex-end;background:var(--pri);border-bottom-right-radius:4px}.bub.them{border-bottom-left-radius:4px}.bub small{display:block;opacity:.7;font-size:11px;margin-top:4px}
.compose{display:flex;gap:10px;padding:14px;border-top:1px solid var(--hair)}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:min(420px,100%);background:var(--g3);border:1px solid var(--hair2);border-radius:24px;padding:28px;box-shadow:0 40px 80px -40px rgba(0,0,0,.9)}
.otp{letter-spacing:.5em;text-align:center;font-weight:800;font-size:22px}
@media (max-width:1180px){.g6{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.g21,.g12{grid-template-columns:1fr}}
@media (max-width:820px){.side{position:static;width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--hair);padding:8px}.side .grp{display:none}.side button{width:auto;flex:none}main{margin-left:0;padding:16px}.g3,.g2,.g4,.g6{grid-template-columns:1fr 1fr}.brand{min-width:0}.brand small,.who span{display:none}.msgwrap{grid-template-columns:1fr}.pick.c4{grid-template-columns:1fr 1fr}}
</style>
</head>

<script>
/* ScanSay admin console (demo data in localStorage). Live: replace store() with API calls (see server/stripe.js). */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kr=n=>Math.round(n).toLocaleString('sv-SE')+' kr';
const D=t=>new Date(t).toLocaleDateString('sv-SE',{day:'numeric',month:'short',year:'numeric'});
const DS=t=>new Date(t).toLocaleDateString('sv-SE',{day:'numeric',month:'short'});
const NOW=Date.now(),DAY=864e5;
const ICO=p=>`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={home:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',apps:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',acc:'<path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1M9 17h1M14 17h1"/>',
 sub:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',inv:'<path d="M5 2h14v20l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h3"/>',msg:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"/>',
 users:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M16 4a4 4 0 0 1 0 8M22 21c0-3-1.5-5-4-6"/>',agent:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/><path d="M19 4l1.5 1.5L23 3"/>',
 set:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
 tool:'<path d="M14.7 6.3a4 4 0 0 0 5 5L22 14l-8 8-2.3-2.3a4 4 0 0 0-5-5L2 10l8-8z"/>',money:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 12h.01M18 12h.01"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',plus:'<path d="M12 5v14M5 12h14"/>',card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
 trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',check:'<path d="M20 6L9 17l-5-5"/>',bell:'<path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>'};
const LOGO='<svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lgA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7A45"/><stop offset="1" stop-color="#FF3D77"/></linearGradient></defs><path d="M14 2h36a11 11 0 0 1 11 11v33a11 11 0 0 1-11 11H27l-14 7v-7h-1A9 9 0 0 1 3 48V13A11 11 0 0 1 14 2z" fill="url(#lgA)"/>'+[[0,0],[1,0],[2,0],[0,1],[2,1],[0,2],[1,2],[2,2],[4,0],[5,0],[6,0],[4,1],[6,1],[4,2],[5,2],[6,2],[0,4],[1,4],[2,4],[0,5],[2,5],[0,6],[1,6],[2,6],[4,4],[6,4],[5,5],[4,6],[3,3],[5,3],[3,5],[6,6],[3,1],[1,3]].map(([x,y])=>`<rect x="${13+x*5.5}" y="${11+y*5.5}" width="4.6" height="4.6" rx="1.2" fill="#fff"/>`).join('')+'</svg>';

/* ---------- reference data ---------- */
const INDS={hotel:'Hotell',taxi:'Taxi',bus:'Buss och spårvagn',stop:'Hållplatser',restaurant:'Restaurang',cafe:'Kafé',gym:'Gym',spa:'Spa',shop:'Butik',workshop:'Verkstad',salon:'Frisör och skönhet',cleaning:'Städ och fastighet',office:'Kontor'};
const UNIT={hotel:'rum',taxi:'bilar',bus:'fordon',stop:'hållplatser',restaurant:'bord',cafe:'platser',gym:'zoner',spa:'rum',shop:'butiker',workshop:'platser',salon:'stolar',cleaning:'objekt',office:'rum'};
const PLANS={start:{n:'Start',base:690,per:15,feat:'Inkorg, larm och statistik'},pro:{n:'Pro',base:1490,per:12,feat:'+ svar till kund, intyg och rapporter'},business:{n:'Business',base:2990,per:9,feat:'+ AI-insikter, flera grupper, API'},enterprise:{n:'Enterprise',base:5990,per:7,feat:'Allt, SSO, egen avtalsnivå'}};
const priceFor=(plan,places,interval)=>{const p=PLANS[plan],m=p.base+p.per*Math.max(0,places-10);return interval==='year'?Math.round(m*10/10)*10:Math.round(m/10)*10};
const monthlyOf=s=>s.interval==='year'?s.price/12:s.price;
const STATUS={active:['Aktiv','t-ok'],trial:['Provperiod','t-info'],past_due:['Förfallen','t-bad'],paused:['Pausad','t-warn'],canceled:['Uppsagd','t-mut']};
const COLORS=['#FF7A45','#FF3D77','#FFB547','#60A5FA','#34D399','#A78BFA','#F472B6'];
const ini=n=>n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

/* ---------- store ---------- */
const KEY='ssadm2';let S;

/* ---------- charts (inline SVG) ---------- */
function months12(){const d=new Date(NOW);return[...Array(12)].map((_,k)=>{const m=new Date(d.getFullYear(),d.getMonth()-11+k,1);return{s:m.getTime(),e:new Date(m.getFullYear(),m.getMonth()+1,1).getTime(),l:m.toLocaleDateString('sv-SE',{month:'short'})}})}
function revenueChart(){const ms=months12();const data=ms.map(m=>{const iv=S.invoices.filter(i=>i.status==='paid'&&i.issued>=m.s&&i.issued<m.e);return{l:m.l,st:iv.filter(i=>i.method==='stripe').reduce((s,i)=>s+i.amount,0),fa:iv.filter(i=>i.method==='invoice').reduce((s,i)=>s+i.amount,0)}});
 const mx=Math.max(1,...data.map(d=>d.st+d.fa))*1.12,W=720,H=240,bw=W/12*.56;
 const bars=data.map((d,k)=>{const x=k*W/12+(W/12-bw)/2,h1=d.st/mx*(H-30),h2=d.fa/mx*(H-30);return `<rect x="${x}" y="${H-20-h1}" width="${bw}" height="${h1}" rx="6" fill="url(#gS)"><title>${d.l}: Stripe ${kr(d.st)}</title></rect><rect x="${x}" y="${H-20-h1-h2-3}" width="${bw}" height="${h2}" rx="6" fill="#60A5FA" opacity=".85"><title>${d.l}: Faktura ${kr(d.fa)}</title></rect><text x="${x+bw/2}" y="${H-4}" text-anchor="middle" font-size="11" fill="#71717A">${d.l}</text>`}).join('');
 const grid=[.25,.5,.75,1].map(f=>`<line x1="0" x2="${W}" y1="${H-20-(H-30)*f}" y2="${H-20-(H-30)*f}" stroke="rgba(255,255,255,.06)"/><text x="${W}" y="${H-24-(H-30)*f}" text-anchor="end" font-size="10.5" fill="#71717A">${kr(mx*f/1.12)}</text>`).join('');
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><defs><linearGradient id="gS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7A45"/><stop offset="1" stop-color="#FF3D77"/></linearGradient></defs>${grid}${bars}</svg>
 <div class="row" style="gap:16px;margin-top:6px;font-size:12.5px;color:var(--tx2)"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--sun);margin-right:6px"></i>Stripe (automatiskt)</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#60A5FA;margin-right:6px"></i>Faktura</span></div>`}
function donut(parts){const tot=parts.reduce((s,p)=>s+p[1],0)||1;let a=0;const R=54,C=2*Math.PI*R;
 const segs=parts.map(([l,v,c])=>{const len=v/tot*C;const s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${c}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-a}" transform="rotate(-90 70 70)"/>`;a+=len;return s}).join('');
 return `<div class="row" style="gap:18px;flex-wrap:nowrap"><svg width="140" height="140" viewBox="0 0 140 140"><circle r="${R}" cx="70" cy="70" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="18"/>${segs}</svg><div style="display:grid;gap:8px">${parts.map(([l,v,c])=>`<div><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${c};margin-right:8px"></span><b>${esc(l)}</b> <span class="sub">${Math.round(v/tot*100)} %</span></div>`).join('')}</div></div>`}
function hbars(rows){const mx=Math.max(1,...rows.map(r=>r[1]));return rows.map(([l,v,t])=>`<div style="margin:8px 0"><div class="row between" style="font-size:13px"><span>${esc(l)}</span><b>${t}</b></div><div style="height:8px;border-radius:8px;background:rgba(255,255,255,.06);margin-top:5px;overflow:hidden"><i style="display:block;height:100%;width:${v/mx*100}%;background:var(--sun);border-radius:8px"></i></div></div>`).join('')}

 openDrawer(`<div class="row between"><h1>Faktura ${i.no}</h1><button class="btn ghost sm" onclick="closeAll()">Stäng</button></div><div class="card" style="margin-top:14px;background:#fff;color:#0F1013"><div class="row between"><div style="display:flex;align-items:center;gap:8px"><span style="width:30px;display:inline-block">${LOGO}</span><b style="font-size:20px">ScanSay</b></div><div style="text-align:right"><b>${i.no}</b><div style="font-size:12px;color:#555">${D(i.issued)}</div></div></div>
 <p style="margin:18px 0 4px;color:#555;font-size:12px">Kund</p><b>${esc(a.name)}</b><div style="font-size:13px;color:#555">${esc(a.email)}</div>

let TH=null;

 return `<div class="hd"><div><h1>Meddelanden</h1><div class="sub">Kontaktkanal med kunderna. Svaren går till företagets inkorg i översikten och som e-post.</div></div><div class="row"><button class="btn" onclick="broadcast()">${ICO(I.bell)} Utskick till flera</button><button class="btn pri" onclick="msgTo()">${ICO(I.plus)} Nytt meddelande</button></div></div>

 <div class="card conv">${t?`<div class="convh row between"><div><b style="font-size:16px">${esc(t.subject)}</b><div class="sub">${esc((A(t.acc)||{}).name||'')} · ${esc((A(t.acc)||{}).email||'')}</div></div><button class="btn sm" onclick="openAcc('${t.acc}')">Visa kund</button></div>

function msgTo(accId){openDrawer(`<div class="row between"><h1>Nytt meddelande</h1><button class="btn ghost sm" onclick="closeAll()">Stäng</button></div><label class="l">Till företag</label><select class="f" id="mto">${S.accounts.map(a=>`<option value="${a.id}" ${a.id===accId?'selected':''}>${esc(a.name)}</option>`).join('')}</select>
 <label class="l">Ämne</label><input class="f" id="msub" placeholder="T.ex. Nya funktioner i översikten"><label class="l">Meddelande</label><textarea class="f" id="mtxt" rows="6"></textarea><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn pri" onclick="sendNew()">Skicka</button></div>`)}

function broadcast(){openDrawer(`<div class="row between"><h1>Utskick till flera</h1><button class="btn ghost sm" onclick="closeAll()">Stäng</button></div><label class="l">Mottagare</label><select class="f" id="bto"><option value="all">Alla aktiva kunder (${S.accounts.filter(a=>a.status==='active').length})</option>${Object.entries(INDS).map(([k,n])=>{const c=S.accounts.filter(a=>a.ind===k&&a.status==='active').length;return c?`<option value="${k}">${n} (${c})</option>`:''}).join('')}<option value="invoice">Fakturakunder</option><option value="stripe">Stripe-kunder</option></select>
 <label class="l">Ämne</label><input class="f" id="bsub" placeholder="T.ex. Planerat underhåll söndag kl 06–07"><label class="l">Meddelande</label><textarea class="f" id="btxt" rows="6"></textarea><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn pri" onclick="sendBroadcast()">Skicka utskick</button></div>`)}

 const L=S.accounts.filter(a=>a.status==='active'&&(v==='all'||a.ind===v||a.sub.method===v));L.forEach(a=>S.threads.unshift({id:'th'+Date.now()+a.id,acc:a.id,subject:sub,unread:0,msgs:[{from:'admin',text:txt,ts:Date.now(),by:'Ägare'}]}));log(`Utskick "${sub}" till ${L.length} kunder`);save();closeAll();render();toast(`Skickat till ${L.length} kunder`)}

function users(){const q=Q.toLowerCase();const L=S.users.filter(u=>!q||[u.name,u.email,u.role,(A(u.acc)||{}).name].join(' ').toLowerCase().includes(q));

function addUser(accId){openDrawer(`<div class="row between"><h1>Ny användare</h1><button class="btn ghost sm" onclick="closeAll()">Stäng</button></div><label class="l">Företag</label><select class="f" id="uacc">${S.accounts.map(a=>`<option value="${a.id}" ${a.id===accId?'selected':''}>${esc(a.name)}</option>`).join('')}</select>

function editAgent(id){const g=id?S.agents.find(x=>x.id===id):{id:'',name:'',role:'Kundansvarig',email:'',phone:''};openDrawer(`<div class="row between"><h1>${id?'Ändra agent':'Ny agent'}</h1><button class="btn ghost sm" onclick="closeAll()">Stäng</button></div>
 <label class="l">Namn</label><input class="f" id="gn" value="${esc(g.name)}"><label class="l">Roll</label><select class="f" id="gr">${['Kundansvarig','Säljare','Onboarding','Support','Ekonomi'].map(r=>`<option ${g.role===r?'selected':''}>${r}</option>`).join('')}</select><label class="l">E-post</label><input class="f" id="ge" value="${esc(g.email)}"><label class="l">Telefon</label><input class="f" id="gp" value="${esc(g.phone)}">
