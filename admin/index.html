<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ScanSay Admin</title>
<link rel="icon" href="../brand/scansay-icon.svg" type="image/svg+xml">
<style>
@font-face{font-family:J;src:url(../fonts/jakarta-400.woff2) format('woff2');font-weight:400}
@font-face{font-family:J;src:url(../fonts/jakarta-600.woff2) format('woff2');font-weight:600}
@font-face{font-family:J;src:url(../fonts/jakarta-700.woff2) format('woff2');font-weight:700}
@font-face{font-family:J;src:url(../fonts/jakarta-800.woff2) format('woff2');font-weight:800}
:root{--g0:#0B0B0E;--g1:#0F1013;--g2:#141519;--g3:#18191E;--g4:#1E1F25;--g5:#25262D;--g6:#2E2F37;
 --tx:#ECECEF;--tx2:#A1A1AA;--tx3:#71717A;--hair:rgba(255,255,255,.08);--hair2:rgba(255,255,255,.14);
 --or:#3B82F6;--pk:#1D4ED8;--am:#2563EB;--pri:#1D4ED8;--ok:#34D399;--warn:#FBBF24;--bad:#F87171;--info:#60A5FA;
 --sun:linear-gradient(135deg,#3B82F6,#1D4ED8);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:J,system-ui,sans-serif;font-size:14.5px;line-height:1.5;color:var(--tx);background:radial-gradient(900px 500px at 90% -10%,rgba(59,130,246,.1),transparent 60%),radial-gradient(800px 600px at 0% 110%,rgba(29,78,216,.08),transparent 60%),var(--g1);background-attachment:fixed;min-height:100vh}
a{color:var(--or)}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:28px;letter-spacing:-.03em;margin:0}h2{font-size:17px;margin:0 0 12px;letter-spacing:-.01em}h3{font-size:15px;margin:0}
.sub{color:var(--tx2);font-size:13.5px}
/* layout */
.top{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;gap:16px;padding:0 20px;background:rgba(11,11,14,.82);backdrop-filter:blur(16px);border-bottom:1px solid var(--hair)}
.top:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,#3B82F6 25%,#1D4ED8 75%,transparent);opacity:.7;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;min-width:208px}
.brand svg{width:32px;height:32px;filter:drop-shadow(0 6px 14px rgba(29,78,216,.35))}
.brand b{font-size:21px;font-weight:800;letter-spacing:-.045em}.brand b span{background:var(--sun);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:11px;color:var(--am);font-weight:700;letter-spacing:.04em;margin-top:1px}
.gsearch{flex:1;max-width:520px;position:relative}
.gsearch input{width:100%;background:var(--g3);border:1px solid var(--hair2);border-radius:999px;padding:10px 16px 10px 40px;outline:0}
.gsearch input:focus{border-color:rgba(59,130,246,.6);box-shadow:0 0 0 4px rgba(59,130,246,.12)}
.gsearch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--tx3)}
.gres{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--g3);border:1px solid var(--hair2);border-radius:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.8);padding:6px;display:none;max-height:380px;overflow:auto}
.gres.on{display:block}.gres button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:10px;cursor:pointer}.gres button:hover{background:var(--g5)}
.gres small{color:var(--tx3)}
.tright{margin-left:auto;display:flex;align-items:center;gap:10px}
.who{display:flex;align-items:center;gap:8px;background:var(--g3);border:1px solid var(--hair);border-radius:999px;padding:4px 12px 4px 4px;font-weight:700;font-size:13px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;flex:none}
.side{position:fixed;top:64px;bottom:0;left:0;width:236px;padding:14px 12px;border-right:1px solid var(--hair);background:rgba(11,11,14,.6);overflow:auto;z-index:20}
.side button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--tx2);padding:9px 10px;border-radius:12px;cursor:pointer;font-weight:600;text-align:left;margin-bottom:2px}
.side button .ni{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.05);flex:none}
.side button:hover{background:rgba(255,255,255,.05);color:#fff}
.side button.on{background:var(--pri);color:#fff;box-shadow:0 12px 26px -14px rgba(29,78,216,.9)}.side button.on .ni{background:rgba(255,255,255,.18)}
.side .cnt{margin-left:auto;background:var(--pk);color:#fff;border-radius:999px;font-size:11.5px;font-weight:800;padding:1px 8px}
.side .grp{font-size:11px;font-weight:800;color:var(--tx3);letter-spacing:.08em;text-transform:uppercase;margin:14px 10px 6px}
.side .ext{color:var(--am)}
main{margin-left:236px;padding:24px 26px 60px;max-width:1500px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
/* components */
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.card{background:var(--g3);border:1px solid var(--hair);border-radius:20px;padding:18px}
.kpi{position:relative;overflow:hidden}
.kpi small{display:block;color:var(--tx2);font-weight:600;font-size:12.5px;padding-right:40px}
.kpi b{display:block;font-size:28px;letter-spacing:-.03em;font-weight:800;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12.5px;font-weight:700;color:var(--tx3)}.kpi em.up{color:var(--ok)}.kpi em.dn{color:var(--bad)}
.kpi .ki{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(59,130,246,.14);color:var(--or)}
.kpi.hero{background:linear-gradient(135deg,rgba(59,130,246,.22),rgba(29,78,216,.18)),var(--g3);border-color:rgba(59,130,246,.3)}
.kpi.hero b{font-size:32px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--hair2);background:var(--g4);color:#fff;border-radius:999px;padding:9px 16px;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--g5)}
.btn.pri{background:var(--pri);border-color:var(--pri);box-shadow:0 10px 24px -12px rgba(29,78,216,.9)}.btn.pri:hover{background:#1E40AF}
.btn.ghost{background:transparent}.btn.danger{border-color:rgba(248,113,113,.4);color:#FCA5A5;background:rgba(248,113,113,.08)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-weight:800;font-size:11.5px;white-space:nowrap}
.t-ok{background:rgba(52,211,153,.14);color:#6EE7B7}.t-warn{background:rgba(251,191,36,.14);color:#FCD34D}.t-bad{background:rgba(248,113,113,.14);color:#FCA5A5}.t-info{background:rgba(96,165,250,.14);color:#93C5FD}.t-mut{background:rgba(255,255,255,.07);color:var(--tx2)}.t-sun{background:rgba(59,130,246,.16);color:#93C5FD}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:700;color:var(--tx3);padding:10px 12px;border-bottom:1px solid var(--hair2);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--hair);vertical-align:middle}
tr:last-child td{border-bottom:0}tbody tr.click{cursor:pointer}tbody tr.click:hover td{background:rgba(255,255,255,.03)}
td b{font-weight:700}.num{font-variant-numeric:tabular-nums;text-align:right}
input.f,select.f,textarea.f{background:var(--g4);border:1px solid var(--hair2);border-radius:12px;padding:10px 12px;outline:0;width:100%}
input.f:focus,select.f:focus,textarea.f:focus{border-color:rgba(59,130,246,.6);box-shadow:0 0 0 4px rgba(59,130,246,.12)}
label.l{display:block;font-size:12.5px;font-weight:700;color:var(--tx2);margin:12px 0 6px}
.seg{display:inline-flex;background:var(--g4);border:1px solid var(--hair);border-radius:999px;padding:3px}
.seg button{background:none;border:0;color:var(--tx2);padding:7px 14px;border-radius:999px;font-weight:700;cursor:pointer;font-size:13px}.seg button.on{background:var(--sun);color:#fff}
.pick{display:grid;gap:8px}.pick.c4{grid-template-columns:repeat(4,1fr)}.pick.c2{grid-template-columns:repeat(2,1fr)}
.pick button{background:var(--g4);border:1px solid var(--hair2);border-radius:14px;padding:12px;text-align:left;cursor:pointer;color:var(--tx)}
.pick button b{display:block;font-size:14px}.pick button small{color:var(--tx3);font-size:12px}
.pick button.on{border-color:var(--or);background:rgba(59,130,246,.1);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.chk{display:flex;align-items:center;gap:10px;background:var(--g4);border:1px solid var(--hair2);border-radius:12px;padding:9px 12px;cursor:pointer}
.chk.on{border-color:var(--or);background:rgba(59,130,246,.1)}
.chk input{accent-color:#3B82F6;width:16px;height:16px}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.switch i{width:40px;height:22px;border-radius:999px;background:var(--g6);position:relative;transition:.2s;flex:none}
.switch i:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch.on i{background:var(--sun)}.switch.on i:after{left:21px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}.kv span{color:var(--tx3)}
.empty{color:var(--tx3);text-align:center;padding:30px}
/* drawer + modal */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:60;display:none}.dim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--g2);border-left:1px solid var(--hair2);z-index:70;transform:translateX(105%);transition:transform .25s;overflow:auto;padding:24px;box-shadow:-30px 0 60px -30px rgba(0,0,0,.8)}
.drawer.on{transform:none}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);width:min(440px,92vw);background:var(--g3);border:1px solid var(--hair2);border-radius:20px;padding:22px;z-index:80;opacity:0;pointer-events:none;transition:.15s}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--g5);border:1px solid var(--hair2);color:#fff;border-radius:14px;padding:12px 18px;font-weight:700;opacity:0;transition:.25s;z-index:90;box-shadow:0 20px 40px -20px rgba(0,0,0,.8)}
.toast.on{opacity:1;transform:translateX(-50%)}
.sum{background:linear-gradient(135deg,rgba(59,130,246,.14),rgba(29,78,216,.1));border:1px solid rgba(59,130,246,.3);border-radius:16px;padding:14px 16px;margin-top:14px}
.sum b.big{font-size:26px;letter-spacing:-.03em}
.feed li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:13.5px}.feed li:last-child{border:0}.feed{list-style:none;margin:0;padding:0}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
/* messages */
.msgwrap{display:grid;grid-template-columns:320px 1fr;gap:14px;height:calc(100vh - 190px);min-height:520px}
.thl{overflow:auto;padding:8px}.th{display:block;width:100%;text-align:left;background:none;border:0;border-radius:14px;padding:12px;cursor:pointer;color:var(--tx)}
.th:hover{background:var(--g4)}.th.on{background:var(--g5)}.th b{display:block}.th small{color:var(--tx3)}.th .un{float:right;background:var(--pk);color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:0 7px}
.conv{display:flex;flex-direction:column;padding:0;overflow:hidden}.convh{padding:16px 18px;border-bottom:1px solid var(--hair)}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:72%;padding:10px 14px;border-radius:16px;background:var(--g5);font-size:14px}.bub.me{align-self:flex-end;background:var(--pri);border-bottom-right-radius:4px}.bub.them{border-bottom-left-radius:4px}.bub small{display:block;opacity:.7;font-size:11px;margin-top:4px}
.compose{display:flex;gap:10px;padding:14px;border-top:1px solid var(--hair)}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:min(420px,100%);background:var(--g3);border:1px solid var(--hair2);border-radius:24px;padding:28px;box-shadow:0 40px 80px -40px rgba(0,0,0,.9)}
.otp{letter-spacing:.5em;text-align:center;font-weight:800;font-size:22px}
@media (max-width:1180px){.g6{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.g21,.g12{grid-template-columns:1fr}}
@media (max-width:820px){.side{position:static;width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--hair);padding:8px}.side .grp{display:none}.side button{width:auto;flex:none}main{margin-left:0;padding:16px}.g3,.g2,.g4,.g6{grid-template-columns:1fr 1fr}.brand{min-width:0}.brand small,.who span{display:none}.msgwrap{grid-template-columns:1fr}.pick.c4{grid-template-columns:1fr 1fr}}
.btn.lime{background:#E4002B!important;border-color:#B8001F!important;color:#FFFFFF!important;font-weight:800}.btn.lime:hover{background:#C70026!important}</style>

.empty{color:#6B7280}
a{color:#1D4ED8}
body,button,input,select,textarea{font-family:var(--font)!important}h1,h2,h3,.kpi b,.brand b{font-family:var(--font-h)!important;letter-spacing:-.025em}

function hbars(rows){const mx=Math.max(1,...rows.map(r=>r[1]));return rows.map(([l,v,t])=>`<div style="margin:8px 0"><div class="row between" style="font-size:13px"><span>${esc(l)}</span><b>${t}</b></div><div style="height:8px;border-radius:8px;background:rgba(255,255,255,.06);margin-top:5px;overflow:hidden"><i style="display:block;height:100%;width:${v/mx*100}%;background:var(--sun);border-radius:8px"></i></div></div>`).join('')}

 const step=(n,t,on,done)=>`<div style="display:flex;gap:8px;align-items:center;opacity:${on||done?1:.45}"><span style="width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:${done?'#15803D':on?'#1D4ED8':'#E5E7EB'};color:${done||on?'#fff':'#374151'}">${done?'✓':n}</span><b style="font-size:13px">${t}</b></div>`;
 const order=['new','info','offer_sent','changes','signed','approved'],k=order.indexOf(st);
 const tl=offs.map(o=>`<div style="padding:12px 0;border-top:1px solid var(--hair)"><div class="row between"><b>Offert v${o.version} · ${kr(o.price||0)}/${o.interval==='year'?'år':'mån'}</b><span class="sub">${D(o.ts)}</span></div>
   <div class="sub" style="margin-top:4px">${({sent:'Skickad · väntar på svar',changes:'Kunden vill ändra',signed:'Signerad'+(o.reply&&o.reply.record?' av '+esc(o.reply.record.name)+', '+esc(o.reply.record.title):''),declined:'Kunden är inte intresserad',superseded:'Ersatt av en nyare offert'})[o.status]||o.status}</div>
   ${o.reply&&o.reply.message?`<div style="margin-top:8px;padding:10px 12px;border-radius:12px;background:#FFF7ED;border:1px solid #FED7AA;white-space:pre-wrap"><b>Kunden skriver:</b> ${esc(o.reply.message)}${o.reply.price?`<br><b>Önskat pris:</b> ${esc(o.reply.price)}`:''}</div>`:''}${o.note?`<div class="sub" style="margin-top:6px">Ditt meddelande: ${esc(o.note)}</div>`:''}</div>`).join('');
 const btns=DONE.includes(st)?'':st==='signed'?`<button class="btn pri" onclick="approve()">${ICO(I.check)} Godkänn och skapa konto</button><button class="btn ghost" onclick="notInterested()">Inte intresserad</button>`
  :`<button class="btn" onclick="requestInfo()">${ICO(I.msg)} Begär komplettering</button>${st==='changes'&&last?`<button class="btn" onclick="resendSame()">Skicka samma offert igen</button>`:''}${(st==='offer_sent'||st==='changes')&&last?`<button class="btn lime" onclick="remindSign()">🔔 Påminn om signering</button>`:''}<button class="btn pri" onclick="sendOffer()">${ICO(I.msg)} ${offs.length?'Skicka ny offert med priset ovan':'Skicka offert'}</button><button class="btn ghost" onclick="notInterested()">Inte intresserad</button>`;
 return `<h2 style="margin-top:22px">7. Offert och svar</h2>
  <div class="row" style="gap:14px;flex-wrap:wrap;margin:6px 0 12px">${step(1,'Registrering',k>=0,k>0)}${step(2,'Offert skickad',k>=2,k>=4||st==='changes')}${step(3,'Kunden svarar',st==='changes'||k>=4,k>=4)}${step(4,'Signerad',k>=4,k>=5)}${step(5,'Konto skapat',k>=5,k>=5)}</div>
  <div style="padding:12px 14px;border-radius:14px;background:var(--g4);font-size:14px">${({new:'Granska uppgifterna. Behöver du veta mer, begär komplettering. Annars skickar du offerten direkt.',info:'Du har bett om mer information. När du har svaret skickar du offerten.',offer_sent:'Offerten är skickad. Kunden kan signera, be om ändringar eller tacka nej. Du får ett mejl när kunden svarar.',changes:'Kunden vill ändra något. Läs önskemålet nedan och skicka samma offert igen eller en ny med ändrat pris eller innehåll.',signed:'Kunden har signerat. Godkänn för att skapa kontot och skicka välkomstmejlet med inloggning.',approved:'Kontot är skapat.',not_interested:'Markerad som inte intresserad.',declined:'Avslagen.'})[st]||''}</div>
  ${st==='changes'||st==='new'||st==='info'||st==='offer_sent'?`<label class="l">Meddelande till kunden i offertmejlet (valfritt)</label><textarea class="f" id="ofnote" rows="2" placeholder="T.ex. Vi har sänkt priset enligt önskemål och lagt till parkering."></textarea>`:''}
  ${tl?`<div style="margin-top:10px">${tl}</div>`:''}
  ${last&&last.data&&last.data.reminders&&last.data.reminders.length?`<div class="sub" style="margin-top:8px">🔔 Påmind ${last.data.reminders.length} ${last.data.reminders.length===1?'gång':'gånger'}, senast ${D(last.data.reminders[last.data.reminders.length-1])}.</div>`:''}
  <div class="row" style="margin-top:16px;flex-wrap:wrap;gap:8px">${btns}</div>
  ${st!=='signed'&&!DONE.includes(st)?`<div class="sub" style="margin-top:10px">Behöver du skapa kontot utan signatur? <a href="javascript:void 0" onclick="approve()">Godkänn ändå</a></div>`:''}`}
async function sendOffer(same){const a=S.apps.find(x=>x.id===OF.id);const d=same&&a.offers&&a.offers[0]&&a.offers[0].data?a.offers[0].data:contractData('app',a.id);const note=($('ofnote')||{}).value||'';
 if(!a.email&&!(d.customer&&d.customer.email)){toast('Kundens e-post saknas');return}
 if(ADM_LIVE){toast('Skickar offerten…');try{const r=await admApi('offer_send',{app_id:a.live?a.id:null,offer:d,note});if(!a.live){a.id=r.app_id;a.live=true;OF.id=r.app_id}
   (a.offers||[]).forEach(o=>{if(o.status==='sent'||o.status==='changes')o.status='superseded'});a.offers=[{id:r.offer_id,version:r.version,price:d.price,interval:d.interval,status:'sent',ts:Date.now(),note,data:d}].concat(a.offers||[]);a.status='offer_sent';a.offer=Object.assign({},OF);save();drawApp();toast('Offert v'+r.version+' skickad till '+d.customer.email)}catch(e){toast('Kunde inte skicka: '+e.message)}return}
 let url;try{url=await signLink('app',a.id)}catch(e){toast('Kunde inte skapa länk: '+e.message);return}
 (a.offers||[]).forEach(o=>{if(o.status==='sent'||o.status==='changes')o.status='superseded'});const v=((a.offers||[])[0]||{version:0}).version+1;
 a.offers=[{version:v,price:d.price,interval:d.interval,status:'sent',ts:Date.now(),note,data:d}].concat(a.offers||[]);a.status='offer_sent';a.sentForSign=Date.now();a.offer=Object.assign({},OF);save();compose('app',a.id,'sign',null,url)}
function resendSame(){sendOffer(true)}
async function remindSign(){const a=S.apps.find(x=>x.id===OF.id),last=(a.offers||[])[0];if(!last)return;
 if(ADM_LIVE&&a.live){const m=prompt('Påminnelse till '+(a.email||'kunden')+'. Skriv ett eget meddelande eller lämna tomt för standardtexten:','');if(m===null)return;
  try{const r=await admApi('offer_remind',{app_id:a.id,message:m,sms:!!a.phone});last.data=last.data||{};last.data.reminders=r.reminders;save();drawApp();toast('Påminnelsen är skickad'+(a.phone?' (e-post och sms)':''))}catch(e){toast('Kunde inte skicka: '+e.message)}return}
 let url;try{url=await signLink('app',a.id)}catch(e){toast('Kunde inte skapa länk: '+e.message);return}last.data=last.data||{};last.data.reminders=(last.data.reminders||[]).concat(Date.now());save();compose('app',a.id,'signrem',null,url)}
async function sendContract(id,rem){const a=A(id);if(!a)return;const d=contractData('acc',id);d.ref='acc:'+id;
 if(!d.customer.email){toast('Kunden saknar e-post');return}
 if(ADM_LIVE){if(!confirm((rem?'Skicka en påminnelse om avtalet till ':'Skicka avtalet för signering till ')+d.customer.email+'?'))return;
  try{await admApi('contract_send',{offer:d,reminder:!!rem,sms:false});a.contractSent=a.contractSent||[];a.contractSent.push(Date.now());if(typeof ED!=='undefined'&&ED&&ED.id===id)ED.contractSent=a.contractSent.slice();save();drawAcc();toast(rem?'Påminnelsen är skickad':'Avtalet är skickat för signering')}catch(e){toast('Kunde inte skicka: '+e.message)}return}
 let url;try{url=await signLink('acc',id)}catch(e){toast('Kunde inte skapa länk: '+e.message);return}a.contractSent=a.contractSent||[];a.contractSent.push(Date.now());save();compose('acc',id,rem?'signrem':'sign',null,url)}
function requestInfo(){const a=S.apps.find(x=>x.id===OF.id);a.status='info';save();
 if(ADM_LIVE&&a.live){const m=prompt('Vad behöver du veta? Texten skickas till '+a.email,'Hej '+(a.contact||'').split(' ')[0]+'!\n\nTack för er registrering. För att ta fram rätt offert behöver vi veta:\n1. Hur många rum eller platser ska ha en QR-kod?\n2. Hur många i personalen behöver logga in?\n3. Kort eller faktura?\n\nVänliga hälsningar\nScanSay');if(!m){return}

 compose('app',a.id,'info')}

function approve(){const a=S.apps.find(x=>x.id===OF.id);const start=new Date(OF.start).getTime()||NOW;const per=OF.interval==='year'?365:30;
 const acc={id:'ac'+Date.now(),name:a.company,org:a.org,ind:OF.ind,city:a.city,places:OF.places,contact:a.contact,email:a.email,phone:a.phone,agents:OF.agents.slice(),seats:OF.seats,mods:{staff:!!OF.staff,ai:OF.ai!==false},sign:a.signed||null,status:'active',created:NOW,
  sub:{plan:OF.plan,interval:OF.interval,price:OF.price,method:OF.method,start,renew:start+per*DAY,autoRenew:OF.autoRenew,end:OF.term?start+OF.term*30.44*DAY:null,stripeId:OF.method==='stripe'?'sub_'+Math.random().toString(36).slice(2,12):null},notes:OF.note};
 S.accounts.unshift(acc);a.status='approved';a.acc=acc.id;
 const no=1001+S.invoices.length;S.invoices.unshift({id:'in'+Date.now(),no:'SS-'+no,acc:acc.id,amount:OF.price,issued:start,due:start+(OF.method==='invoice'?S.settings.invoiceDays:0)*DAY,status:OF.method==='stripe'?'paid':'open',method:OF.method,period:OF.interval});
 S.users.unshift({id:'u'+Date.now(),acc:acc.id,name:a.contact,email:a.email,role:'Ägare',last:0,twofa:false});
 S.threads.unshift({id:'th'+Date.now(),acc:acc.id,subject:'Välkommen till ScanSay',unread:0,msgs:[{from:'admin',text:`Hej ${a.contact.split(' ')[0]}! Ert konto är klart. Paket ${PLANS[OF.plan].n}, ${kr(OF.price)}/${OF.interval==='year'?'år':'månad'}. ${OF.method==='stripe'?'Betalningen dras automatiskt via Stripe.':'Faktura skickas till '+a.email+'.'} Ni har ${OF.seats} agentinloggningar. Er kontaktperson är ${AG(OF.agents[0]).name}.`,ts:NOW,by:AG(OF.agents[0]).name}]});
 log(`${a.company} godkänd · ${PLANS[OF.plan].n} · ${kr(OF.price)}/${OF.interval==='year'?'år':'mån'} · ${OF.method==='stripe'?'Stripe':'faktura'}`);
 save();closeAll();render();
 if(ADM_LIVE){toast('Skapar kontot och skickar inbjudan…');admApi('approve',{app_id:a.live?a.id:null,account:{name:acc.name,org:acc.org,ind:acc.ind,city:acc.city,email:acc.email,phone:acc.phone,contact:acc.contact,seats:seatsOf(OF.roles),roles:OF.roles,kind:OF.kind,max_children:OF.kind==='group'?OF.children:0,places:acc.places,plan:acc.sub.plan,mods:acc.mods,unit:UNIT[acc.ind],billing:{plan:acc.sub.plan,price:acc.sub.price,interval:acc.sub.interval,method:acc.sub.method,invoiceDays:S.settings.invoiceDays,useStripe:acc.sub.method==='stripe',start:acc.sub.start,termMonths:OF.term,autoRenew:acc.sub.autoRenew}}})
  .then(r=>{acc.liveId=r.account_id;save();render();toast('Klart! Inbjudan skickad till '+acc.email+(r.pay&&r.pay.checkoutUrl?' · betallänk skickad':r.pay&&r.pay.error?' · Stripe: '+r.pay.error:''))}).catch(e=>toast('Kontot kunde inte skapas: '+e.message));return}
 toast(OF.method==='stripe'?'Konto skapat · Stripe-betallänk skickad till '+a.email:'Konto skapat · faktura '+'SS-'+no+' skapad')}
function appStatus(id,st){const a=S.apps.find(x=>x.id===id);a.status=st;if(ADM_LIVE&&a.live)admApi('app',{id,status:st}).catch(()=>{});log(`${a.company}: ${st==='declined'?'ansökan avslagen':st==='not_interested'?'inte intresserad':'begäran om mer info skickad'}`);save();closeAll();render();toast(st==='declined'?'Ansökan avslagen':st==='not_interested'?'Markerad som inte intresserad':'Begäran om mer information skickad')}

 else{const i=S.accounts.findIndex(a=>a.id===ED.id);S.accounts[i]=ED;log('Kund uppdaterad: '+ED.name)}save();closeAll();render();

function renewOne(id,silent){const a=A(id),s=a.sub,per=s.interval==='year'?365:30;const no=1001+S.invoices.length;
 S.invoices.unshift({id:'in'+Date.now()+Math.random().toString(36).slice(2,5),no:'SS-'+no,acc:a.id,amount:s.price,issued:Math.max(NOW,s.renew-per*DAY>NOW?NOW:s.renew),due:(s.method==='invoice'?NOW+S.settings.invoiceDays*DAY:NOW),status:s.method==='stripe'?'paid':'open',method:s.method,period:s.interval});
 s.renew+=per*DAY;if(a.status==='past_due'&&s.method==='stripe')a.status='active';log(`${a.name} förnyad · ${s.method==='stripe'?'betald via Stripe':'faktura SS-'+no+' skapad'}`);if(!silent){save();render();toast(s.method==='stripe'?'Förnyad · '+kr(s.price)+' dragen via Stripe':'Faktura SS-'+no+' skapad · skicka till kunden')}}
function runRenewals(){const due=S.accounts.filter(a=>(a.status==='active'||a.status==='past_due')&&a.sub.autoRenew&&a.sub.renew-NOW<7*DAY);due.forEach(a=>renewOne(a.id,true));save();render();toast(due.length?`${due.length} prenumerationer förnyade (Stripe drar automatiskt, fakturor skapade för övriga)`:'Inga förnyelser de närmaste 7 dagarna')}

 <div class="card"><h2>${ICO(I.inv)} Företagsuppgifter i avtalet</h2><div class="grid g2">${[['name','Företagsnamn'],['org','Org.nr'],['vatNo','Momsreg.nr'],['bankgiro','Bankgiro'],['address','Adress'],['email','E-post']].map(([k,l])=>`<div><label class="l">${l}</label><input class="f" value="${esc(st.seller[k]||'')}" oninput="S.settings.seller['${k}']=this.value"></div>`).join('')}</div>

 <div class="card"><h2>${ICO(I.tool)} Avancerade verktyg</h2><p class="sub">Intyg, branschmallar, GDPR och avtal, piloter, system och lansering finns i de avancerade verktygen.</p><a class="btn" href="advanced.html">Öppna avancerade verktyg →</a></div>
${ADM_LIVE?"":` <div class="card"><h2>Demodata</h2><p class="sub">Återställ exempeldatan om du vill börja om.</p><button class="btn danger" onclick="confirmBox('Återställ demodata?','Alla ändringar du gjort i demot försvinner.','Återställ',()=>{localStorage.removeItem(KEY);load();render();toast('Demodatan är återställd')})">Återställ</button></div>`}</div>`}


/* ---------- contract, signing and messaging ---------- */
const apiOn=()=>ADM_LIVE?!!admKey():!!(S.settings.api&&S.settings.api.key);
const apiBase=()=>(S.settings.api&&S.settings.api.url)||'';
async function api(path,body){const r=await fetch(apiBase()+path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(ADM_LIVE?admKey():S.settings.api.key)},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Fel '+r.status));return j}
async function testApi(){if(!apiOn()){toast('Lägg in admin-nyckeln först');return}try{await api('/api/send',{test:true});$('api_st').textContent='Kopplad ✓';toast('Anslutningen fungerar')}catch(e){$('api_st').textContent='Fel: '+e.message;toast('Kunde inte ansluta: '+e.message)}}
function contractData(kind,id){
  if(kind==='acc'){const a=A(id);return{no:'AVT-'+a.id.slice(-6).toUpperCase(),seller:S.settings.seller,customer:{name:a.name,org:a.org,contact:a.contact,email:a.email,phone:a.phone,address:a.city},plan:a.sub.plan,industry:INDS[a.ind],places:a.places,unit:UNIT[a.ind],agents:a.seats,price:a.sub.price,interval:a.sub.interval,method:a.sub.method,start:a.sub.start,termMonths:a.sub.end?Math.round((a.sub.end-a.sub.start)/(30.44*DAY)):12,autoRenew:a.sub.autoRenew,invoiceDays:S.settings.invoiceDays,vat:S.settings.vat,staff:!!(a.mods&&a.mods.staff),ai:!(a.mods&&a.mods.ai===false)}}
  const a=S.apps.find(x=>x.id===id);return{no:'OFF-'+a.id.slice(-6).toUpperCase(),seller:S.settings.seller,customer:{name:a.company,org:a.org,contact:a.contact,email:a.email,phone:a.phone,address:a.city},plan:OF.plan,industry:INDS[OF.ind],places:OF.places,unit:UNIT[OF.ind],agents:OF.seats,price:OF.price,interval:OF.interval,method:OF.method,start:OF.start,termMonths:OF.term,autoRenew:OF.autoRenew,invoiceDays:S.settings.invoiceDays,vat:S.settings.vat,note:OF.note,staff:!!OF.staff,ai:OF.ai!==false,roles:OF.roles,kind:OF.kind,children:OF.kind==='group'?OF.children:0,options:OF.alts&&OF.alts.length?OF.alts.map(x=>Object.assign({},x)):undefined}}
function previewContract(accId){const d=accId?contractData('acc',accId):contractData('app',OF.id);
  const w=document.createElement('div');w.id='cprev';w.innerHTML=`<style>${SSContract.CSS}#cprev{position:fixed;inset:0;z-index:95;background:rgba(10,15,28,.7);overflow:auto;padding:30px 16px}#cprev .bar{max-width:820px;margin:0 auto 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;color:#fff}@media print{body>*:not(#cprev){display:none!important}#cprev{position:static;background:none;padding:0}#cprev .bar{display:none}}</style>
  <div class="bar"><b>Förhandsgranskning · avtalsversion ${SSContract.VERSION}</b><div class="row"><button class="btn" onclick="window.print()">Skriv ut eller spara som PDF</button>${accId?'':'<button class="btn pri" onclick="document.getElementById(\'cprev\').remove();sendForSigning()">Skicka för signering</button>'}<button class="btn" onclick="document.getElementById('cprev').remove()">Stäng</button></div></div>${SSContract.offer(d)}`;
  document.body.appendChild(w)}
async function signLink(kind,id){const d=contractData(kind,id);d.ref=kind+':'+id;
  if(apiOn()){const j=await api('/api/sign-link',{offer:d});return j.url}
  const t=btoa(unescape(encodeURIComponent(JSON.stringify(d)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');return location.origin+location.pathname.replace(/admin\/.*$/,'')+'sign/?demo=1&t='+t}
async function sendForSigning(){const a=S.apps.find(x=>x.id===OF.id);let url;try{url=await signLink('app',a.id)}catch(e){toast('Kunde inte skapa länk: '+e.message);return}
  a.sentForSign=Date.now();a.offer=Object.assign({},OF);a.status='info';save();compose('app',a.id,'sign',null,url)}
const TPL={
 confirm:{n:'Bekräfta konto',s:'Bekräftelse: ert ScanSay-konto',t:(x)=>`Hej ${x.first}!\n\nTack för er ansökan till ScanSay. Vi har tagit emot uppgifterna för ${x.company} och återkommer med offert och avtal inom en arbetsdag.\n\nBekräfta gärna att uppgifterna stämmer genom att svara på det här mejlet.\n\nVänliga hälsningar\n${x.me}\nScanSay · hello@scansay.se`,sms:(x)=>`Hej ${x.first}! Tack för er ansökan till ScanSay. Vi återkommer med offert inom en arbetsdag. /${x.me}, ScanSay`},
 sign:{n:'Be om signatur',s:'Avtal att signera: ScanSay',t:(x)=>`Hej ${x.first}!\n\nHär är offerten och avtalet för ${x.company}. Läs igenom och signera elektroniskt via länken nedan. Det tar ungefär två minuter.\n\n${x.link||'[länk skapas när du skickar]'}\n\nNär avtalet är signerat aktiverar vi kontot och skickar inloggningen.\n\nVänliga hälsningar\n${x.me}\nScanSay · hello@scansay.se`,sms:(x)=>`Hej ${x.first}! Avtalet från ScanSay är klart att signera: ${x.link||''} /${x.me}`},
 signrem:{n:'Påminn om signering',s:'Påminnelse: avtal att signera',t:(x)=>`Hej ${x.first}!\n\nVi vill påminna om offerten och avtalet för ${x.company}. Ni signerar elektroniskt via länken nedan, det tar ungefär två minuter. Vill ni ändra något går det också bra via länken.\n\n${x.link||''}\n\nVänliga hälsningar\n${x.me}\nScanSay · hello@scansay.se`,sms:(x)=>`Hej ${x.first}! Påminnelse: avtalet från ScanSay väntar på er signatur: ${x.link||''} /${x.me}`},
 info:{n:'Be om mer information',s:'Några frågor om er ansökan',t:(x)=>`Hej ${x.first}!\n\nTack för er ansökan. För att ta fram rätt offert behöver vi veta:\n\n1. Hur många platser (rum, bilar, hållplatser eller bord) ska ha en QR-kod?\n2. Hur många i personalen behöver logga in?\n3. Vill ni betala med kort eller faktura?\n\nVänliga hälsningar\n${x.me}\nScanSay`,sms:(x)=>`Hej ${x.first}! Vi behöver några uppgifter för er offert. Vi har mejlat er. /${x.me}, ScanSay`},
 remind:{n:'Betalningspåminnelse',s:'Påminnelse: obetald faktura',t:(x)=>`Hej ${x.first}!\n\nVi har inte fått betalt för den senaste fakturan för ${x.company}. Betala gärna inom 10 dagar för att undvika avstängning. Har ni redan betalt kan ni bortse från detta.\n\nFrågor? Svara på det här mejlet.\n\nVänliga hälsningar\n${x.me}\nScanSay`,sms:(x)=>`Hej ${x.first}! Påminnelse från ScanSay: en faktura är obetald. Se mejl för detaljer.`},
 welcome:{n:'Välkommen',s:'Välkommen till ScanSay',t:(x)=>`Hej ${x.first}!\n\nVälkommen till ScanSay. Ert konto är aktiverat och ni får inloggningen i ett separat mejl.\n\nVänliga hälsningar\n${x.me}\nScanSay`,sms:(x)=>`Välkommen till ScanSay! Inloggningen kommer per e-post. /${x.me}`},
 custom:{n:'Eget meddelande',s:'',t:(x)=>`Hej ${x.first}!\n\n\n\nVänliga hälsningar\n${x.me}\nScanSay`,sms:(x)=>`Hej ${x.first}! `}};
let CM=null;
function compose(kind,id,tpl,chan,link){if((tpl==='sign'||tpl==='signrem')&&!link){signLink(kind,id).then(u=>compose(kind,id,tpl,chan,u)).catch(e=>toast('Kunde inte skapa signeringslänk: '+e.message));return}const t=kind==='acc'?A(id):S.apps.find(x=>x.id===id);const x={first:(t.contact||'').split(' ')[0]||'',company:kind==='acc'?t.name:t.company,me:(AG((t.agents||[])[0]||S.agents[0].id)||{name:'ScanSay'}).name,link};
  CM={kind,id,tpl,link,email:t.email,phone:t.phone,company:x.company,chan:chan||'email',x};drawCompose()}
function drawCompose(){const T=TPL[CM.tpl],x=CM.x;
  openDrawer(`<div class="row between"><div><div class="sub">Till ${esc(CM.company)}</div><h1>Skicka meddelande</h1></div><button class="btn ghost sm" onclick="closeAll()">Stäng</button></div>
  <label class="l">Mall</label><select class="f" onchange="CM.tpl=this.value;if((this.value==='sign'||this.value==='signrem')&&!CM.link){compose(CM.kind,CM.id,this.value,CM.chan);return}drawCompose()">${Object.entries(TPL).map(([k,v])=>`<option value="${k}" ${CM.tpl===k?'selected':''}>${v.n}</option>`).join('')}</select>
  <label class="l">Kanal</label><div class="seg">${[['email','E-post'],['sms','Sms'],['both','Båda']].map(([k,l])=>`<button class="${CM.chan===k?'on':''}" onclick="CM.chan='${k}';drawCompose()">${l}</button>`).join('')}</div>
  ${CM.chan!=='sms'?`<label class="l">E-post</label><input class="f" id="cm_to" value="${esc(CM.email)}"><label class="l">Ämne</label><input class="f" id="cm_sub" value="${esc(T.s||'')}"><label class="l">Meddelande</label><textarea class="f" id="cm_txt" rows="12">${esc(T.t(x))}</textarea>`:''}
  ${CM.chan!=='email'?`<label class="l">Mobilnummer</label><input class="f" id="cm_ph" value="${esc(CM.phone||'')}" placeholder="+46 70 123 45 67"><label class="l">Sms (högst 300 tecken)</label><textarea class="f" id="cm_sms" rows="4" maxlength="300">${esc(T.sms(x))}</textarea>`:''}
  ${CM.link?`<div class="sum" style="margin-top:12px"><div class="sub">Signeringslänk</div><a href="${esc(CM.link)}" target="_blank" rel="noopener" style="word-break:break-all">${esc(CM.link)}</a></div>`:''}
  <div class="row" style="margin-top:16px;justify-content:space-between"><span class="sub">${apiOn()?'Skickas direkt via er server':'Demoläge: koppla servern under Inställningar för att skicka på riktigt'}</span><button class="btn pri" onclick="sendCompose()">${ICO(I.msg)} Skicka</button></div>`)}
async function sendCompose(){const em=CM.chan!=='sms',sm=CM.chan!=='email';const body={};
  if(em){body.email={to:$('cm_to').value.trim(),subject:$('cm_sub').value.trim(),text:$('cm_txt').value};if(!/^\S+@\S+\.\S+$/.test(body.email.to)){toast('Ogiltig e-postadress');return}}
  if(sm){body.sms={to:$('cm_ph').value.trim(),text:$('cm_sms').value};if(!/^\+?[\d\s-]{8,}$/.test(body.sms.to)){toast('Ogiltigt mobilnummer');return}}
  try{if(apiOn())await api('/api/send',body)}catch(e){toast('Kunde inte skicka: '+e.message);return}
  const accId=CM.kind==='acc'?CM.id:(S.apps.find(x=>x.id===CM.id)||{}).acc;const text=(em?body.email.text:body.sms.text);
  if(accId){let th=S.threads.find(t=>t.acc===accId&&t.subject===(em?body.email.subject:'Sms'));if(!th){th={id:'th'+Date.now(),acc:accId,subject:em?body.email.subject:'Sms',unread:0,msgs:[]};S.threads.unshift(th)}th.msgs.push({from:'admin',text,ts:Date.now(),by:CM.x.me})}
  log(`${TPL[CM.tpl].n} skickat till ${CM.company} (${CM.chan==='both'?'e-post och sms':CM.chan==='sms'?'sms':'e-post'})`);save();closeAll();render();toast(apiOn()?'Skickat':'Demo: meddelandet sparades men skickades inte')}

/* ---------- shell ---------- */
const NAV=[['overview','Översikt',I.home],['apps','Ansökningar',I.apps],['customers','Kunder',I.acc],['subs','Prenumerationer',I.sub],['invoices','Fakturor',I.inv],['messages','Meddelanden',I.msg],['users','Användare',I.users],['agents','Team',I.agent],['settings','Inställningar',I.set]];
function drawSide(){const s=stats();const c={apps:s.newApps.length,messages:s.unread,invoices:s.open.filter(i=>i.status==='overdue').length};
 const el=$('side');if(!el)return;el.innerHTML=`<div class="grp">Översikt</div>`+NAV.map(([k,l,ic],i)=>(i===2?'<div class="grp">Kunder och pengar</div>':i===5?'<div class="grp">Kontakt och team</div>':'')+`<button class="${TAB===k?'on':''}" onclick="go('${k}')"><span class="ni">${ICO(ic)}</span>${l}${c[k]?`<span class="cnt">${c[k]}</span>`:''}</button>`).join('')+`<div class="grp">Mer</div><button class="ext" onclick="location.href='advanced.html'"><span class="ni">${ICO(I.tool)}</span>Avancerade verktyg</button><button onclick="location.href='../index.html'"><span class="ni">${ICO(I.out)}</span>Till webbplatsen</button>`}
function go(t){TAB=t;Q='';closeAll();render();scrollTo(0,0);try{history.replaceState(null,'','#'+t)}catch(e){}}
function render(){if(!sessionStorage.getItem('ssadm-auth')){return loginView()}
 if(!$('side')){$('root').innerHTML=`<header class="top"><a class="brand" href="#overview" onclick="go('overview');return false"><img src="../brand/scansay-logo.svg" alt="ScanSay" width="149" height="32"><span><small>ADMIN</small></span></a>
  <div class="gsearch"><span>${ICO(I.search)}</span><input id="gq" placeholder="Sök kunder, användare, fakturor…" autocomplete="off"><div class="gres" id="gres"></div></div>
  <div class="tright"><span class="who"><span class="av" style="background:var(--sun)">ÄG</span><span>Ägare · 2FA</span></span><button class="btn sm ghost" onclick="sessionStorage.removeItem('ssadm-auth');location.reload()" title="Logga ut">${ICO(I.out)}</button></div></header><nav class="side" id="side"></nav><main id="main"></main>`;bindSearch()}
 drawSide();$('main').innerHTML={overview,apps,customers,subs,invoices,messages,users,agents,settings}[TAB]();
 if(TAB==='messages')setTimeout(()=>{const m=$('msgs');if(m)m.scrollTop=m.scrollHeight},0)}
render.later=()=>{clearTimeout(render._t);render._t=setTimeout(()=>{const a=document.activeElement,pos=a&&a.selectionStart,ph=a&&a.placeholder;render();if(ph){const el=[...document.querySelectorAll('#main input')].find(e=>e.placeholder===ph);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}},250)};
function bindSearch(){const q=$('gq'),r=$('gres');q.addEventListener('input',()=>{const t=q.value.trim().toLowerCase();if(!t){r.classList.remove('on');return}
 const acc=S.accounts.filter(a=>[a.name,a.city,a.email,a.org].join(' ').toLowerCase().includes(t)).slice(0,5),us=S.users.filter(u=>[u.name,u.email].join(' ').toLowerCase().includes(t)).slice(0,4),iv=S.invoices.filter(i=>i.no.toLowerCase().includes(t)).slice(0,3);
 r.innerHTML=acc.map(a=>`<button onclick="openAcc('${a.id}');$('gres').classList.remove('on')">${ICO(I.acc)}<span><b>${esc(a.name)}</b><br><small>Kund · ${INDS[a.ind]} · ${esc(a.city)}</small></span></button>`).join('')+us.map(u=>`<button onclick="go('users');Q=${JSON.stringify(u.email)};render()">${ICO(I.users)}<span><b>${esc(u.name)}</b><br><small>Användare · ${esc(u.email)}</small></span></button>`).join('')+iv.map(i=>`<button onclick="printInv('${i.id}')">${ICO(I.inv)}<span><b>${i.no}</b><br><small>Faktura · ${kr(i.amount)}</small></span></button>`).join('')||'<div class="empty" style="padding:14px">Inga träffar</div>';r.classList.add('on')});
 document.addEventListener('click',e=>{if(!e.target.closest('.gsearch'))r.classList.remove('on')})}
const LIVE=/^https?:$/.test(location.protocol)&&!/localhost|127\.0\.0\.1|claude\.ai|claudeusercontent/.test(location.hostname);
function loginView(){$('root').innerHTML=`<div class="login"><form class="lbox" onsubmit="event.preventDefault();doLogin()"><div style="display:flex;align-items:center;gap:10px;margin-bottom:18px"><span style="width:42px;display:inline-block">${LOGO}</span><div><b style="font-size:24px;letter-spacing:-.04em">Scan<span style="color:#1D4ED8">Say</span></b><div style="font-size:11px;color:#1D4ED8;font-weight:800;letter-spacing:.06em">ADMIN</div></div></div>
 <h1 style="font-size:22px">Logga in</h1><p class="sub">Endast för ScanSays team.</p>
 ${LIVE?`<label class="l">Admin-nyckel</label><input class="f" id="lk" type="password" autocomplete="current-password" required>`:`<label class="l">E-post</label><input class="f" id="le" type="email" value="admin@scansay.se" autocomplete="username"><label class="l">Lösenord</label><input class="f" id="lp" type="password" value="demo-demo" autocomplete="current-password"><p class="sub" style="font-size:12.5px;margin:10px 0 0">Demo: uppgifterna är ifyllda.</p>`}
 <button class="btn pri" style="width:100%;justify-content:center;margin-top:16px;padding:12px">Logga in</button><p class="sub" id="lerr" style="color:#B91C1C;margin:10px 0 0"></p></form></div>`}
async function doLogin(){if(LIVE){const k=$('lk').value.trim();if(!k){return}try{const r=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+k},body:'{"test":true}'});if(!r.ok)throw new Error();sessionStorage.setItem('ssadm-key',k)}catch(e){$('lerr').textContent='Fel nyckel, eller så är servern inte uppsatt än.';return}
 sessionStorage.setItem('ssadm-auth','1');try{await liveLoad()}catch(e){$('lerr').textContent='Inloggad, men databasen svarar inte: '+e.message;return}$('root').innerHTML='';render();return}
 sessionStorage.setItem('ssadm-auth','1');$('root').innerHTML='';render()}
addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
const h=location.hash.slice(1);if(NAV.some(n=>n[0]===h))TAB=h;
if(ADM_LIVE){S=seed();S.accounts=[];S.apps=[];migrate();if(admKey()&&sessionStorage.getItem('ssadm-auth')){$('root').innerHTML='<div style="padding:60px;text-align:center;font-family:Inter,Arial">Laddar…</div>';liveLoad().then(render).catch(e=>{$('root').innerHTML='<div style="padding:60px;max-width:560px;margin:auto;font-family:Inter,Arial"><h1>Kunde inte ladda</h1><p>'+esc(e.message)+'</p><p>Kontrollera att SUPABASE_URL och SUPABASE_SERVICE_KEY finns i Vercel och att schema.sql har körts.</p><button class="btn pri" onclick="location.reload()">Försök igen</button></div>'})}else render()}
else{load();migrate();render()}
</script>
</body>
</html>
