:root{--ink:#0F1013;--muted:#5B5B66;--line:#E4E4E9;--bg:#F4F4F6;--black:#0F1013;--lime:#1D4ED8;--soft:#F6F6F8;--limeink:#1D4ED8;--warn:#fff4d6;--err:#b42318;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px;border-radius:8px}
.bar{background:var(--black);border-bottom:3px solid var(--lime)}
.bar .in{max-width:480px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;gap:10px}
.word{display:grid;line-height:1}.word b{font-family:SSWord,system-ui,sans-serif;font-weight:800;font-size:19px;letter-spacing:-.04em;color:#fff}.word b.lrow{display:inline-flex;align-items:center;gap:0}.lrow svg{margin-right:8px}.word b.lrow svg{width:30px;height:30px;margin:0 8px 0 0}.word b .say{color:#3B82F6}
.word i{font-family:SSSerif,Georgia,serif;font-weight:600;font-size:12.5px;color:#E4E4E7;margin-top:3px}.word i em{color:var(--lime)}
.lang{margin-left:auto;display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.lang button{border:0;background:none;border-radius:999px;padding:5px 11px;font-weight:700;font-size:13px;color:#D6CEBB;cursor:pointer}
.lang button.on{background:linear-gradient(135deg,#BFDBFE,#FFC97A 30%,#3B82F6 62%,#B07D10);color:var(--black)}
.wrap{max-width:480px;margin:0 auto;padding:14px 14px 40px}
.place{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;gap:14px;align-items:center;margin-bottom:12px}
.place .ic{width:48px;height:48px;border-radius:14px;background:var(--black);color:var(--lime);display:grid;place-items:center;flex:none;font-weight:800}
.place b{display:block;font-size:18px;letter-spacing:-.01em}.place small{color:var(--muted);font-size:13px}.place small.co{display:block;font-weight:800;color:var(--limeink);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
h1{font-size:23px;margin:0 0 4px;letter-spacing:-.02em}
.lead{color:var(--muted);margin:0 0 4px;font-size:15px}
.lbl{display:block;font-weight:700;font-size:14.5px;margin:20px 0 8px}
.lbl small{font-weight:500;color:var(--muted)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 0 8px;font-weight:800;font-size:20px;cursor:pointer;display:grid;gap:2px}
.scale button small{font-size:10.5px;font-weight:600;color:var(--muted)}
.scale button.on{background:var(--black);color:var(--lime);border-color:var(--black)}.scale button.on small{color:#E4E4E7}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:11px 4px;font-weight:700;font-size:14px;cursor:pointer}
.seg button.on{border-color:var(--black);background:var(--black);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
.chips button.on{border-color:var(--black);background:var(--lime);color:var(--black)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:700;cursor:pointer}
.yn button.on{background:var(--black);color:#fff;border-color:var(--black)}
.nps{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.nps button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:8px 0;font-weight:700;font-size:13px;cursor:pointer}
.nps button.on{background:var(--lime);border-color:var(--black)}
.npsl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}
textarea,input[type=email],input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;outline:none}
textarea{min-height:100px;resize:vertical}
textarea:focus,input:focus{border-color:var(--black)}
input.bad{border-color:var(--err)}
.hint{font-size:13px;color:var(--err);margin-top:6px;display:none}.hint.show{display:block}
.photo{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--muted);font-size:14px}
.photo img{width:48px;height:48px;object-fit:cover;border-radius:8px}
.sos{display:none;background:var(--warn);border:1px solid #e9d27a;color:#5c4a05;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}.sos.show{display:block}
.send{width:100%;margin-top:22px;border:0;border-radius:14px;padding:15px;background:linear-gradient(135deg,#BFDBFE,#FFC97A 30%,#3B82F6 62%,#B07D10);color:var(--black);font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 10px 24px rgba(201,162,39,.35)}
.send:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.priv{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.45}.priv a{color:var(--ink)}
.done{text-align:center;padding:26px 10px}
.done .ok{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#BFDBFE,#FFC97A 30%,#3B82F6 62%,#B07D10);color:var(--black);display:grid;place-items:center;margin:0 auto 12px}
.case{display:inline-block;background:var(--black);color:var(--lime);border-radius:10px;padding:8px 14px;font-weight:800;letter-spacing:.06em;margin:10px 0}
.ghost{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}
.code input{text-transform:uppercase;letter-spacing:.2em;font-weight:800;text-align:center;font-size:20px}
.offline{display:none;background:#e7f0ff;color:#1d3d7a;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}.offline.show{display:block}
.prog{height:4px;background:#E4E4E9;border-radius:4px;margin:12px 0 0;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(135deg,#BFDBFE,#FFC97A 30%,#3B82F6 62%,#B07D10);transition:width .3s}
.demo{margin-top:22px;border-top:1px dashed var(--line);padding-top:14px;font-size:13px;color:var(--muted)}
.demo .chips button{font-size:12.5px;padding:6px 10px}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:16px}.foot a{color:var(--ink);font-weight:700}
.pw{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:18px;font-size:12px;color:var(--muted)}
.hp{position:absolute!important;left:-9999px;width:1px;height:1px;overflow:hidden}
.hint.sug{color:#1E3A8A;background:#EFF6FF;border-radius:8px;padding:8px 10px}.hint.sug button{border:0;background:none;color:#1E3A8A;font-weight:800;text-decoration:underline;cursor:pointer;padding:0;font:inherit}
.copy{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14.5px;color:#3a372f}.copy input{width:18px;height:18px;margin-top:2px;accent-color:#B07D10}
.shield{display:flex;gap:8px;align-items:center;font-size:12.5px;color:#5B5B66;margin-top:10px}.shield svg{flex:none}
.err{display:none;margin-top:12px;background:#FDE8E6;color:#B4231C;border-radius:10px;padding:10px 12px;font-size:14px}.err.show{display:block}
.send.busy{opacity:.75;cursor:wait}
.mailbox{position:fixed;inset:0;background:rgba(15,16,19,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.mailbox.show{display:flex}
.mail{background:#fff;border-radius:14px;max-width:440px;width:100%;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4);font-size:14.5px}

.mail .mb{padding:20px}.mail .mb h3{margin:0 0 8px;font-size:19px}.mail .q{background:#F6F6F8;border-left:3px solid #C8A27C;padding:10px 12px;margin:12px 0;border-radius:6px;white-space:pre-wrap}
.mail .row{display:flex;justify-content:space-between;border-bottom:1px dashed #E4E4E9;padding:5px 0;font-size:13.5px}.mail .row span{color:#5B5B66}
.mail .cf{display:block;text-align:center;background:#C8A27C;color:#fff;font-weight:800;border:0;border-radius:6px;padding:12px;width:100%;margin-top:14px;cursor:pointer;font-size:15px}
.mail .ft{font-size:12px;color:#7a766c;padding:0 20px 16px}.mail .x{float:right;border:0;background:none;font-size:20px;cursor:pointer;line-height:1}
.vok{background:#FFEDE5;color:#1E40AF;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}

   :`<div class="sentto">${t.sent} <b>${esc(mask(v.norm,v.method))}</b>. ${t.valid}</div>${v.method==='email'?`<div class="spamn">📬 ${L==='sv'?'<b>Hittar du inte koden?</b> Titta i mappen <b>Skräppost</b> (Spam/Skräp). Det kan ta upp till en minut. Markera gärna mejlet som ”Inte skräp”.':'<b>Can’t find the code?</b> Check your <b>Spam/Junk</b> folder. It can take up to a minute.'}</div>`:`<div class="spamn">📱 ${L==='sv'?'Sms:et kommer från <b>ScanSay</b> inom en minut. Kontrollera numret om det inte kommer.':'The SMS comes from <b>ScanSay</b> within a minute. Check the number if it doesn’t arrive.'}</div>`}
    <label class="lbl" for="vo">${t.codeL}</label>
    <input class="otp" id="vo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" aria-label="${t.codeL}" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,6);if(this.value.length===6)ssV.check()">
    <div class="verr ${v.err?'show':''}">${esc(v.err)}</div>
    <button class="send" type="button" ${v.busy?'disabled':''} onclick="ssV.check()">${v.busy?t.checking:t.ok}</button>
    <div class="links"><button type="button" onclick="ssV.change()">${t.change}</button><button type="button" id="vres" ${left?'disabled':''} onclick="ssV.resend()">${left?t.resendIn+left+' s':t.resend}</button></div>`;
  return `<div class="card vfy"><span class="step">${t.step}</span><h1>${t.h}</h1><p class="lead">${t.p}</p>${body}<div class="why">${shield}<span>${t.why}</span></div><button class="vback" type="button" onclick="ssV.close()">${t.back}</button></div>`}
function paint(){const app=$('app'),c=app.querySelector('.card');if(!c)return;c.outerHTML=card();
  const f=$('vo')||$('vc');if(f&&!('ontouchstart' in window))f.focus();tick()}
let timer;function tick(){clearInterval(timer);const v=st.vfy;if(!v||!v.sent)return;timer=setInterval(()=>{const b=$('vres');if(!b){clearInterval(timer);return}const left=Math.max(0,Math.ceil((v.sentAt+RESEND-Date.now())/1000));const t=VT[L];b.disabled=!!left;b.textContent=left?t.resendIn+left+' s':t.resend;if(!left)clearInterval(timer)},1000)}
function notify(c,m){const t=VT[L];let n=$('vnote');if(!n){n=document.createElement('div');n.id='vnote';n.className='vnote';n.setAttribute('role','status');document.body.appendChild(n)}
  n.innerHTML=`<small>${m==='sms'?t.nSms:t.nMail}</small><b>${c}</b>${t.nTxt}<i>${t.nDemo}</i>`;requestAnimationFrame(()=>n.classList.add('show'));clearTimeout(n._t);n._t=setTimeout(()=>n.classList.remove('show'),14000)}
async function api(path,body){const r=await fetch(window.SS_API.replace(/\/$/,'')+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});return [r.status,await r.json().catch(()=>({}))]}
window.ssV={
 method(m){const v=V();v.method=m;v.err='';paint()},
 close(){V().open=false;render()},
 change(){const v=V();v.sent=false;v.err='';paint()},
 async start(){const v=V(),t=VT[L];v.err='';
  const norm=v.method==='sms'?normPhone(v.contact):(SSG.email(v.contact).ok?String(v.contact).trim().toLowerCase():null);
  if(!norm){v.err=v.method==='sms'?t.e.phone:(t.e[SSG.email(v.contact).reason]||t.e.format);paint();return}
  const key=await hash(norm);try{const d=+localStorage.getItem(doneKey(key))||0;if(Date.now()-d<864e5){v.err=t.e.already;paint();return}}catch(e){}
  v.busy=true;paint();
  if(window.SS_API){const g=await SSG.check({hp:'',minMs:0,key:'v-'+code,body:norm,max:5,win:6e5});
    const [s,r]=await api('/api/form?a=start',{method:v.method,contact:norm,code,guard:g.proof?{challenge:g.proof.challenge,nonce:g.proof.nonce,ms:Math.max(g.ms||0,4000)}:null});
    v.busy=false;if(s!==200){v.err=t.e[r.error]||t.e.send;paint();return}v.verifyId=r.verifyId}
  else{try{const rl=JSON.parse(localStorage.getItem('ss-vrate')||'[]').filter(x=>Date.now()-x<36e5);if(rl.length>=3){v.busy=false;v.err=t.e.rate;paint();return}rl.push(Date.now());localStorage.setItem('ss-vrate',JSON.stringify(rl))}catch(e){}
    const a=new Uint32Array(1);crypto.getRandomValues(a);const otp=String(a[0]%1e6).padStart(6,'0');v.h=await hash(otp+'|'+key);v.exp=Date.now()+TTL;await new Promise(r=>setTimeout(r,600));v.busy=false;notify(otp,v.method)}
  v.norm=norm;v.key=key;v.sent=true;v.sentAt=Date.now();v.tries=0;paint()},
 resend(){const v=V();v.sent=false;this.start()},
 async check(){const v=V(),t=VT[L],inp=$('vo'),otp=(inp&&inp.value||'').replace(/\D/g,'');if(otp.length!==6||v.busy)return;v.err='';
  if(window.SS_API){v.busy=true;paint();v.otp=otp;v.busy=false;st.vfy.ok=true;st.vfy.open=false;return finish()}
  if(Date.now()>v.exp){v.err=t.e.expired;v.sent=false;paint();return}
  if(++v.tries>TRIES){v.err=t.e.tries;v.sent=false;paint();return}
  if(await hash(otp+'|'+v.key)!==v.h){v.err=t.e.wrong+(TRIES-v.tries);paint();const i=$('vo');if(i)i.select();return}
  v.ok=true;v.open=false;finish()}
};
const origSend=send;
async function finish(){const v=st.vfy;if(v.method==='email')st.email=v.norm;st.copy=true;
  if(window.SS_API){/* live: the server checks the code and stores the message */
    const g=await SSG.check({hp:($('hpw')||{}).value||'',minMs:4000,key:'f-'+code,body:st.msg+'|'+v.norm,max:3,win:6e5});if(!g.ok){st.err=g.reason;render();return}
    const c=CODES[code],sec=secOf(c);const [s,r]=await api('/api/form?a=feedback',{verifyId:v.verifyId,otp:v.otp,code,company:tl(c.c),place:TP.tr(c.p,'sv'),topic:topicOf(sec),urgent:!!(st.urgOpen&&st.urgent),rating:st.rating||1,type:['c','p','i','q'][st.type??0],quick:st.quick,aspects:st.asp||null,image:st.img||null,message:st.msg.trim(),name:st.name.trim()||null,copy:true,guard:{challenge:g.proof.challenge,nonce:g.proof.nonce,ms:g.ms}});
    if(s===200&&r.ref)window.SS_LASTREF=r.ref;if(s!==200){v.ok=false;v.open=true;v.sent=r.error==='wrong';v.err=VT[L].e[r.error]+(r.error==='wrong'?r.triesLeft:'');if(r.error!=='wrong')v.err=VT[L].e[r.error]||VT[L].e.send;render();return}
  }
  if(window.SS_API){st.done=true;st.ref=window.SS_LASTREF||'';st.rec={id:'live'};scrollTo(0,0)}else await origSend();
  if(st.rec){st.rec.verified=true;st.rec.via=v.method;if(v.method==='sms')st.rec.phone=v.norm;st.vok=true;
    try{const box=JSON.parse(localStorage.getItem('scansay-inbox')||'[]');const x=box.find(b=>b.id===st.rec.id);if(x){Object.assign(x,{verified:true,via:v.method,phone:st.rec.phone||null,email:st.email||''});localStorage.setItem('scansay-inbox',JSON.stringify(box))}localStorage.setItem(doneKey(v.key),String(Date.now()))}catch(e){}
    render()}}
window.send=send=async function(){if(!ready())return;const v=V();if(v.ok)return finish();v.open=true;v.err='';render();scrollTo(0,0)};
const prevRender=render;
window.render=render=function(){prevRender.apply(this,arguments);const v=st.vfy,t=VT[L];
  if(v&&v.open&&!st.done)paint();
  if(st.done&&v&&v.ok){const h=$('app').querySelector('.card.done h1');if(h&&!$('app').querySelector('.vbadge'))h.insertAdjacentHTML('afterend',`<div class="vbadge">✓ ${v.method==='sms'?t.vSms:t.vMail}</div>`);
    if(v.method==='sms')$('app').querySelectorAll('.card.done p.lead').forEach(p=>{if(p.textContent===T[L].nomail)p.textContent=t.replySms})}};
})();
