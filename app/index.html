/* Layout idea: operational dashboard. Summary tiles first, then time patterns, then places and people. Black/gold/white brand, semantic red/amber only for state. */
:root{--ink:#0F1013;--muted:#5B5B66;--line:#E4E4E9;--bg:#F4F4F6;--card:#fff;--forest:#0F1013;--forest2:#18191E;--lime:#1D4ED8;--soft:#F6F6F8;--good:#1E40AF;--goodbg:#FFEDE5;--bad:#b4381c;--badbg:#fbe9e3;--warn:#8a5a00;--warnbg:#fff3d4;--gold:#1D4ED8;--goldsoft:#F6F6F8;--goldink:#1D4ED8;--limesoft:#F6F6F8;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px;border-radius:6px}
header{background:var(--forest);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:4px solid var(--lime);position:sticky;top:0;z-index:10;flex-wrap:wrap}
.logo{display:flex;gap:10px;align-items:center;font-weight:800;font-size:17px}
.logo small{display:block;font-weight:600;font-size:11.5px;color:#BFDBFE}
.scope{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:13px}
.scope select{background:#18191E;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:8px 10px;font-weight:600}
nav{display:flex;gap:6px;padding:14px 20px 0;max-width:1300px;margin:0 auto;overflow-x:auto}
nav button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-weight:700;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--forest);color:#fff;border-color:var(--forest);box-shadow:inset 0 -3px 0 var(--lime)}
nav .cnt{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;margin-left:5px}
main{max-width:1300px;margin:0 auto;padding:16px 20px 60px}
h1{font-size:22px;margin:0}h2{font-size:15px;margin:0 0 12px}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g32{grid-template-columns:1.6fr 1fr}
.kpi{border-top:4px solid var(--lime)}
.kpi small{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.kpi b{display:block;font-size:30px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:2px 0}
.kpi em{font-style:normal;font-size:12.5px;font-weight:700}
.up{color:var(--good)}.dn{color:var(--bad)}
.seg{display:flex;background:#F0EBDF;border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:8px;border-bottom:2px solid var(--forest);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:middle}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.t-new{background:var(--badbg);color:var(--bad)}.t-prog{background:var(--warnbg);color:var(--warn)}.t-fix{background:var(--goodbg);color:var(--good)}
.t-c{background:var(--badbg);color:var(--bad)}.t-p{background:var(--goodbg);color:var(--good)}.t-i{background:#e8eefc;color:#2a46a8}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;background:var(--forest);color:#fff}
.btn.lime{background:var(--lime);color:var(--forest)}.btn.line{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.sm{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=email],input[type=date],select,textarea{border:1px solid #DED6C2;border-radius:10px;padding:9px 11px;background:#fff}
.case{border:1px solid var(--line);border-left:5px solid #D8CFB8;border-radius:12px;padding:12px 14px;background:#fff;display:grid;gap:8px}
.case.c{border-left-color:var(--bad)}.case.p{border-left-color:var(--good)}.case.i{border-left-color:#2a46a8}
.case .msg{font-size:14.5px}
.reply{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13.5px}
.note{border-radius:12px;padding:12px 14px;font-size:13.5px}
.note.warn{background:var(--warnbg);color:#5c4100}.note.ok{background:var(--goodbg);color:#1b5e36}.note.info{background:var(--soft);color:#5C4508}
.sw{position:relative;width:42px;height:24px;flex:none;display:inline-block}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:#D6CEBB;border-radius:999px;cursor:pointer;transition:.2s}
.sw i:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+i{background:var(--forest2)}.sw input:checked+i:before{transform:translateX(18px)}
.sw input:disabled+i{opacity:.4;cursor:not-allowed}
.heat{display:grid;grid-template-columns:34px repeat(24,1fr);gap:2px;font-size:10.5px;color:var(--muted)}
.heat i{display:block;height:20px;border-radius:3px}
.bar{height:10px;border-radius:5px;background:#F0EBDF;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--forest);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#F1F1F4;border-radius:6px;padding:2px 6px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
@media(max-width:900px){.g4{grid-template-columns:1fr 1fr}.g2,.g32{grid-template-columns:1fr}.hide{display:none}}

.aiw{border:2px solid var(--gold);background:linear-gradient(180deg,#FDFCF8,#fff)}
.aiw .aib{background:var(--gold);color:var(--forest);font-weight:800;font-size:12px;padding:3px 8px;border-radius:7px;margin-right:8px}
.aig{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:10px;margin-top:4px}
.aig>div{border-radius:12px;padding:12px 14px}.aig small{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.aig p,.aig ol{margin:6px 0 0;font-size:14px;line-height:1.45}.aig ol{padding-left:18px;display:grid;gap:4px}
.ai-ok{background:var(--limesoft)}.ai-ok small{color:#1E40AF}.ai-bad{background:var(--goldsoft)}.ai-bad small{color:var(--goldink)}.ai-do{background:#F1F1F4}.ai-do small{color:var(--forest)}
.aitag{font-size:12px;font-weight:700;color:var(--goldink);background:var(--goldsoft);padding:3px 9px;border-radius:999px}
@media (max-width:900px){.aig{grid-template-columns:1fr}}

.qg{grid-template-columns:1.15fr 1fr;align-items:start}
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700;margin-bottom:6px;color:var(--muted)}.crumbs span:not(.tag){color:var(--ink)}
.qsec{border-top:1px solid var(--line);padding:14px 0 6px}
.chipsm{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 4px}.chipsm span{font-size:11.5px;background:var(--limesoft);border-radius:999px;padding:2px 9px;color:#1D4ED8}
.qt{width:100%;border-collapse:collapse;margin-top:6px}.qt td{padding:6px 6px;border-top:1px solid #EFEFF2}.qt tr.sel{background:#FBF7EC}.qt a{color:var(--ink);font-weight:700;text-decoration:none}
.qt code,.qedit code{background:#F1F1F4;border-radius:6px;padding:1px 6px;font-size:12.5px}
.qedit{position:sticky;top:80px}.qedit label{display:grid;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.qedit input,.qsec input,.qsec select,main>.row select,.row>select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.stk{display:grid;place-items:center;background:repeating-conic-gradient(#F7F4EC 0 25%,#fff 0 50%) 0 0/16px 16px;border-radius:14px;padding:18px}
.stk svg{width:auto;height:340px;max-width:100%;filter:drop-shadow(0 10px 22px rgba(0,0,0,.18))}
a.btn{text-decoration:none;display:inline-block}
#printArea{display:none}
@media print{body>*:not(#app){display:none!important}main>*:not(#printArea){display:none!important}#printArea{display:flex!important;flex-wrap:wrap;gap:5mm}.pst svg{display:block}.pst{break-inside:avoid}}
@media (max-width:900px){.qg{grid-template-columns:1fr}.qedit{position:static}}

.g5{grid-template-columns:repeat(5,1fr)}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:#0F1013!important;border-bottom:3px solid #1D4ED8!important;border-image:linear-gradient(90deg,#1D4ED8,#FFC97A,#3B82F6,#1D4ED8) 1!important}
.logo .wm{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:22px;letter-spacing:-.03em;line-height:1}.logo .wm svg{width:30px;height:30px;flex:none}.logo .wm span{color:#fff}.logo .wm .say{color:#3B82F6}
.logo .slg{display:block;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:600;font-size:12.5px;color:#E4E4E7;margin:2px 0 1px}.logo .slg em{color:#1D4ED8}
.logo small{color:#9CA3AF!important}
.scope select{background:#18191E!important;border-color:rgba(201,162,39,.35)!important}

function aiSummary(list,prev,heat){
  const cnt=(l,fn)=>{const m={};l.filter(fn).forEach(f=>{m[f.topic]=(m[f.topic]||0)+1});return m};
  const cNow=cnt(list,f=>f.type==='c'),cPrev=cnt(prev,f=>f.type==='c'),pNow=cnt(list,f=>f.type!=='c');
  const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0];
  const w=top(cNow);const ps=Object.entries(pNow).sort((a,b)=>b[1]-a[1]);const s=(w&&ps.find(x=>x[0]!==w[0]))||ps[0];const praise=list.filter(f=>f.type!=='c').length;
  const share=list.length?Math.round(praise/list.length*100):0;
  const rows=placeRows(list).filter(x=>x.l.length>=3).sort((a,b)=>a.csat-b.csat);const worst=rows[0],best=rows[rows.length-1];
  let pk=[0,0,0];heat.forEach((r,i)=>r.forEach((v,j)=>{if(v>pk[0])pk=[v,i,j]}));
  const secM={};list.filter(f=>f.secName).forEach(f=>{const k=f.g+'|'+f.secName;secM[k]=secM[k]||{n:f.secName,r:[],c:0};if(f.rating)secM[k].r.push(f.rating);if(f.type==='c')secM[k].c++});const secs=Object.values(secM).filter(x=>x.r.length>=4).map(x=>({n:x.n,cs:Math.round(x.r.filter(v=>v>=4).length/x.r.length*100),c:x.c})).sort((a,b)=>a.cs-b.cs);const wsec=secs[0],bsec=secs[secs.length-1];
  const ch=w&&cPrev[w[0]]?Math.round((w[1]-cPrev[w[0]])/cPrev[w[0]]*100):null;
  if(!list.length)return '';
  const strength=s?`${share} % av all feedback är beröm eller idéer. Mest beröm för <b>${esc(s[0]).toLowerCase()}</b>${best?`, och <b>${esc(best.place)}</b> har högst nöjdhet (${best.csat} %).`:'.'}`:'Inget beröm i perioden ännu.';
  const weak=w?`<b>${esc(w[0])}</b> är vanligaste klagomålet (${w[1]} st${ch!==null?`, ${ch>=0?'+':''}${ch} % mot förra perioden`:''}).${wsec?` Svagaste sektion: <b>${esc(wsec.n)}</b> (${wsec.cs} % nöjda).`:''}${worst?` Lägst nöjdhet: <b>${esc(worst.place)}</b> (${worst.csat} %).`:''}`:'Inga klagomål i perioden.';
  const todo=[];
  if(w)todo.push(`Börja med ${esc(w[0]).toLowerCase()}${pk[0]?`, särskilt ${DAYS[pk[1]].toLowerCase()} kl ${pk[2]}–${pk[2]+1}`:''}.`);

  if(worst)todo.push(`Gå igenom de öppna ärendena för ${esc(worst.place)} denna vecka.`);
  if(s)todo.push(`Dela berömmet om ${esc(s[0]).toLowerCase()} med de som jobbade.`);
  return `<div class="card aiw" style="margin-bottom:14px"><div class="row between"><h2 style="margin:0"><span class="aib">AI</span>Sammanfattning för perioden</h2><span class="aitag">Ingår i Insikt</span></div>
   <div class="aig" style="margin-top:12px"><div class="ai-ok"><small>Styrkor</small><p>${strength}</p></div><div class="ai-bad"><small>Svagheter</small><p>${weak}</p></div><div class="ai-do"><small>Gör så här</small><ol>${todo.map(t=>`<li>${t}</li>`).join('')}</ol></div></div>

let AIQ='',AIA='';
function analyse(list,prev,heat){
  const cnt=(l,fn,key)=>{const m={};l.filter(fn).forEach(f=>{const k=key(f);m[k]=(m[k]||0)+1});return m};
  const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);
  const cNow=cnt(list,f=>f.type==='c',f=>f.topic),cPrev=cnt(prev,f=>f.type==='c',f=>f.topic),pNow=cnt(list,f=>f.type!=='c',f=>f.topic);
  const rising=prev.length<20?[]:Object.entries(cNow).map(([k,v])=>({k,v,p:cPrev[k]||0,ch:Math.round((v-(cPrev[k]||0))/Math.max(cPrev[k]||0,1)*100)})).filter(x=>x.v>=4&&x.p>=3).sort((a,b)=>b.ch-a.ch);
  const secM={};list.filter(f=>f.secName).forEach(f=>{const k=(SC==='all'?G(f.g).name+' · ':'')+f.secName;(secM[k]=secM[k]||[]).push(f)});
  const secs=Object.entries(secM).map(([k,l])=>({k,...stats(l),top:top(cnt(l,f=>f.type==='c',f=>f.topic))[0]})).filter(x=>x.n>=5).sort((a,b)=>a.csat-b.csat);
  const places=placeRows(list).filter(x=>x.n>=4).map(x=>({...x,impact:x.comp*(5-x.avg)})).sort((a,b)=>b.impact-a.impact);
  let pk=[0,0,0];heat.forEach((r,i)=>r.forEach((v,j)=>{if(v>pk[0])pk=[v,i,j]}));
  const s=stats(list),sp=stats(prev);
  return{s,sp,w:top(cNow)[0],good:top(pNow).find(x=>!top(cNow)[0]||x[0]!==top(cNow)[0][0])||top(pNow)[0],rising,secs,places,pk,praiseShare:list.length?Math.round(list.filter(f=>f.type!=='c').length/list.length*100):0}}
function aiPanel(list,prev,heat){if(!list.length)return '';const A=analyse(list,prev,heat);
  const ws=A.secs[0],bs=A.secs[A.secs.length-1],rz=A.rising[0],pl=A.places[0];
  const acts=[];
  if(A.w)acts.push({t:`Åtgärda ${esc(A.w[0]).toLowerCase()}`,d:`${A.w[1]} klagomål i perioden${A.pk[0]?`, flest ${DAYS[A.pk[1]].toLowerCase()} kl ${A.pk[2]}–${A.pk[2]+1}`:''}. Lägg resurser där först.`,n:A.w[1]});
  if(pl)acts.push({t:`Gå igenom ${esc(pl.place)}`,d:`${pl.comp} klagomål och snittbetyg ${pl.avg.toFixed(1).replace('.',',')}. Platsen med störst förbättringspotential.`,n:pl.comp});
  if(ws&&bs&&ws.k!==bs.k)acts.push({t:`Lär av ${esc(bs.k.split(' · ').pop()).toLowerCase()}`,d:`${esc(bs.k)} har ${bs.csat} % nöjda mot ${ws.csat} % för ${esc(ws.k)}. Jämför rutinerna.`,n:bs.n});
  return `<div class="card aiw" style="margin-bottom:14px"><div class="row between"><h2 style="margin:0"><span class="aib">AI</span>Insikter för perioden</h2><span class="aitag">Ingår i Insikt</span></div>
   <div class="aig4">
    <div class="ai-ok"><small>Styrka</small><p>${A.praiseShare} % av all feedback är beröm eller idéer.${A.good?` Mest beröm för <b>${esc(A.good[0]).toLowerCase()}</b>.`:''}${bs?` Bäst: <b>${esc(bs.k)}</b> (${bs.csat} % nöjda).`:''}</p></div>
    <div class="ai-bad"><small>Svaghet</small><p>${A.w?`<b>${esc(A.w[0])}</b> är vanligaste klagomålet (${A.w[1]} st).`:'Inga klagomål.'}${ws?` Svagast: <b>${esc(ws.k)}</b> (${ws.csat} % nöjda).`:''}</p></div>
    <div class="ai-tr"><small>Trend</small><p>${prev.length<20?'För lite data för att jämföra med förra perioden ännu.':rz&&rz.ch>0?`<b>${esc(rz.k)}</b> ökar ${rz.ch} % mot förra perioden (${rz.p} → ${rz.v}).`:'Inga ämnen ökar tydligt just nu.'}${A.sp.n>=20?` Nöjdheten ${A.s.csat>=A.sp.csat?'ökar':'minskar'} från ${A.sp.csat} % till ${A.s.csat} %.`:''}</p></div>

   </div>

   <ol class="aiacts">${acts.slice(0,3).map(a=>`<li><div><b>${a.t}</b><span>${a.d}</span></div><em>${a.n} medd.</em></li>`).join('')}</ol>
   <div class="ask"><b>Fråga AI om er data</b><div class="chipsm2">${['Vilken sektion är sämst?','Vad ökar mest?','När kommer flest klagomål?','Vad får mest beröm?','Vad ska vi åtgärda först?','Sammanfatta perioden'].map(q=>`<button onclick="ask('${q}')">${q}</button>`).join('')}</div>

function ask(q){q=(q||'').trim();if(!q)return;AIQ=q;const list=S.fb.filter(f=>inScope(f)&&per(f)),prev=S.fb.filter(f=>inScope(f)&&f.ts<NOW-PER*864e5&&f.ts>=NOW-2*PER*864e5);
  const heat=[...Array(7)].map(()=>Array(24).fill(0));list.filter(f=>f.type==='c').forEach(f=>{const dt=new Date(f.ts);heat[(dt.getDay()+6)%7][dt.getHours()]++});
  const A=analyse(list,prev,heat),x=q.toLowerCase();
  const secHit=A.secs.find(s=>x.includes(s.k.split(' · ').pop().toLowerCase().slice(0,5)));
  if(secHit)AIA=`<b>${esc(secHit.k)}</b>: ${secHit.n} meddelanden, ${secHit.csat} % nöjda, snittbetyg ${secHit.avg.toFixed(1).replace('.',',')}${secHit.nps!=null?`, NPS ${secHit.nps>0?'+':''}${secHit.nps}`:''}${secHit.yes!=null?`, ${secHit.yes} % svarade ja på snabbfrågan`:''}. ${secHit.top?`Vanligaste klagomålet: ${esc(secHit.top[0]).toLowerCase()} (${secHit.top[1]} st).`:'Inga klagomål.'}`;
  else if(/sämst|svag|värst|worst/.test(x))AIA=A.secs.length?`Svagast är <b>${esc(A.secs[0].k)}</b> med ${A.secs[0].csat} % nöjda. Därefter ${A.secs.slice(1,3).map(s=>`${esc(s.k)} (${s.csat} %)`).join(' och ')}.`:'För lite data per sektion ännu.';
  else if(/ökar|trend|mer|rising/.test(x))AIA=A.rising.filter(r=>r.ch>0).slice(0,3).map(r=>`<b>${esc(r.k)}</b> +${r.ch} % (${r.p} → ${r.v})`).join('<br>')||'Inget ämne ökar tydligt jämfört med förra perioden.';
  else if(/när|tid|dag|timme|when/.test(x))AIA=A.pk[0]?`Flest klagomål kommer <b>${DAYS[A.pk[1]].toLowerCase()} kl ${A.pk[2]}–${A.pk[2]+1}</b> (${A.pk[0]} st). Se värmekartan nedan för hela veckan.`:'Inga tydliga toppar.';
  else if(/beröm|bra|bäst|styrk|praise/.test(x))AIA=`${A.praiseShare} % är beröm eller idéer. ${A.good?`Mest beröm för <b>${esc(A.good[0]).toLowerCase()}</b>.`:''} ${A.secs.length?`Bäst sektion: <b>${esc(A.secs[A.secs.length-1].k)}</b> (${A.secs[A.secs.length-1].csat} %).`:''}`;
  else if(/först|åtgärd|prior|gör|fix/.test(x))AIA=A.places.slice(0,3).map((p,i)=>`${i+1}. <b>${esc(p.place)}</b>: ${p.comp} klagomål, snitt ${p.avg.toFixed(1).replace('.',',')}`).join('<br>')||'Inget sticker ut.';
  else AIA=`Perioden: <b>${A.s.n}</b> meddelanden, ${A.s.csat} % nöjda, NPS ${A.s.nps==null?'–':(A.s.nps>0?'+':'')+A.s.nps}, ${A.s.res} % av klagomålen lösta. ${A.w?`Störst problem: ${esc(A.w[0]).toLowerCase()}.`:''} ${A.secs.length?`Svagast: ${esc(A.secs[0].k)}. Starkast: ${esc(A.secs[A.secs.length-1].k)}.`:''}`;
  render();setTimeout(()=>{const e=document.querySelector('.aians');if(e)e.scrollIntoView({block:'nearest',behavior:'smooth'})},50)}
function sectionCard(list){const m={};list.filter(f=>f.secName).forEach(f=>{const k=f.g+'|'+f.secName;(m[k]=m[k]||{g:f.g,nm:f.secName,l:[]}).l.push(f)});

  if(!rows.length)return '';

   ${rows.map(r=>`<tr><td><b>${esc(r.nm)}</b></td>${SC==='all'?`<td class="hide">${esc(G(r.g).name)}</td>`:''}<td>${r.n}</td><td><div class="row" style="gap:8px"><div class="bar" style="width:70px"><i style="width:${r.csat}%;background:${r.csat<50?'#dc5a3c':r.csat<70?'#D6CEBB':'#1D4ED8'}"></i></div>${r.csat} %</div></td><td>${r.nps==null?'–':(r.nps>0?'+':'')+r.nps}</td><td class="hide">${r.yes==null?'–':r.yes+' %'}</td><td>${r.tp?esc(r.tp[0])+' ('+r.tp[1]+')':'–'}</td></tr>`).join('')}</tbody></table></div>`}
function peakText(h){let best=[0,0,0];h.forEach((r,i)=>r.forEach((v,j)=>{if(v>best[0])best=[v,i,j]}));return best[0]?`Flest klagomål: ${DAYS[best[1]]} kl ${best[2]}–${best[2]+1} (${best[0]} st). Planera bemanning och städning därefter.`:'Inga klagomål i perioden.'}
function stack(days){const W=640,H=200,p=26,mx=Math.max(1,...days.map(d=>d.c+d.p));const bw=(W-p*2)/days.length;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${[0,.5,1].map(f=>`<line x1="${p}" x2="${W-p}" y1="${H-p-(H-p*2)*f}" y2="${H-p-(H-p*2)*f}" stroke="#E4E4E7"/><text x="${p-6}" y="${H-p-(H-p*2)*f+4}" font-size="10" fill="#7A7466" text-anchor="end">${Math.round(mx*f)}</text>`).join('')}
  ${days.map((d,i)=>{const x=p+i*bw+bw*.15,w=bw*.7,hc=(H-p*2)*d.c/mx,hp=(H-p*2)*d.p/mx;return `<rect x="${x}" y="${H-p-hc}" width="${w}" height="${hc}" rx="2" fill="#0F1013"/><rect x="${x}" y="${H-p-hc-hp}" width="${w}" height="${hp}" rx="2" fill="#3B82F6"/>`}).join('')}
  <text x="${p}" y="${H-6}" font-size="10" fill="#7A7466">för 30 dagar sedan</text><text x="${W-p}" y="${H-6}" font-size="10" fill="#7A7466" text-anchor="end">idag</text></svg>`}

  const tot=list.length;list=list.slice(0,30);

function setSt(id,v){const F=S.fb.find(f=>f.id===id);F.status=v;if(v==='fix')F.fixTs=Math.max(F.ts,NOW)+(Date.now()-T0)+9e5;save();render();toast(v==='fix'?'Svar skickat · ärendet är löst':'Markerat som pågår')}

/* ---------------- places ---------------- */
function placeRows(list){const m={};list.forEach(f=>{const k=f.g+'|'+f.place;m[k]=m[k]||{g:f.g,place:f.place,l:[]};m[k].l.push(f)});
  return Object.values(m).map(x=>{const s=stats(x.l);const half=x.l.filter(f=>f.ts>=NOW-PER*864e5/2);const old=x.l.length-half.length;return{...x,...s,tr:half.length-old}})}
function places(){
  const rows=placeRows(S.fb.filter(f=>inScope(f)&&per(f))).sort((a,b)=>PSORT==='c'?b.comp-a.comp:PSORT==='p'?b.praise-a.praise:b.n-a.n);
  return `<div class="row between" style="margin-bottom:12px"><div><h1>Platser</h1><div class="sub">Rum, fordon, bord och ytor rangordnade · ${esc(scopeName())}</div></div><div class="row">${perSeg()}<div class="seg">${[['c','Flest klagomål'],['p','Mest beröm'],['n','Mest feedback']].map(([v,l])=>`<button class="${PSORT===v?'on':''}" onclick="PSORT='${v}';render()">${l}</button>`).join('')}</div></div></div>
  <div class="card" style="overflow-x:auto"><table><thead><tr><th>#</th><th>Plats</th>${SC==='all'?'<th class="hide">Grupp</th>':''}<th>Skanningar</th><th>Klagomål</th><th>Beröm</th><th>CSAT</th><th class="hide">Lösta</th><th>Trend</th></tr></thead><tbody>
  ${rows.map((x,i)=>`<tr><td class="sub">${i+1}</td><td><b>${esc(x.place)}</b></td>${SC==='all'?`<td class="hide">${esc(G(x.g).name)}</td>`:''}<td>${x.scans}</td><td><span class="tag t-c">${x.comp}</span></td><td><span class="tag t-p">${x.praise}</span></td>
    <td><div class="row" style="gap:8px"><div class="bar" style="width:70px"><i style="width:${x.csat}%;background:${x.csat<50?'#dc5a3c':x.csat<70?'#9ca3af':'#3B82F6'}"></i></div>${x.csat} %</div></td><td class="hide">${x.res} %</td>
    <td class="${x.tr>0?'dn':'up'}">${x.tr>0?'▲':'▼'} ${Math.abs(x.tr)}</td></tr>`).join('')}</tbody></table>
  <div class="sub" style="margin-top:10px">Trend = feedback senaste halvan av perioden mot första halvan.</div></div>`;
}

  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'image/svg+xml'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Nedladdning startad')}catch(e){toast('Nedladdning blockeras här. Använd Skriv ut.')}}
function dl1(){dlBlob('scansay-'+QSEL+'.svg','<?xml version="1.0" encoding="UTF-8"?>'+stOf(QSEL))}
function dlSheet(){const codes=Object.keys(QCHK).filter(k=>QCHK[k]);const z=stSize(),W=z.w,H=z.h,cols=Math.max(1,Math.floor(195/(W+5))),rows=Math.max(1,Math.floor(282/(H+5)));const per=cols*rows;
  const pages=[];for(let i=0;i<codes.length;i+=per)pages.push(codes.slice(i,i+per));
  pages.forEach((pg,pi)=>{let body='';pg.forEach((c,i)=>{const x=10+(i%cols)*(W+5),y=10+Math.floor(i/cols)*(H+5);body+=`<svg x="${x}" y="${y}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${stOf(c).replace(/<svg[^>]*>/,'').replace('</svg>','')}</svg>`});
   dlBlob(`scansay-ark-${pi+1}.svg`,`<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm">${body}</svg>`)})}
function printSel(codes){const pa=$('printArea');pa.innerHTML=codes.map(c=>`<div class="pst">${stOf(c)}</div>`).join('');try{window.print()}catch(e){toast('Utskrift blockeras här. Ladda ner i stället.')}}

function addPlaces(si){const g=qG(),s=g.secs[si],v=$('np'+si).value.trim();if(!v)return toast('Skriv ett platsnamn');
  const m=v.match(/^(.*?)(\d+)\s*[-–]\s*(\d+)$/);let names=[v];if(m){const a=+m[2],b=+m[3];if(b<a||b-a>199)return toast('Ange ett intervall på högst 200');names=[];for(let i=a;i<=b;i++)names.push(m[1]+i)}
  names.forEach(n=>s.places.push({name:n,code:newCode()}));g.places=g.secs.flatMap(x=>x.places.map(p=>p.name));save();render();toast(names.length+' nya QR-koder i '+s.name)}
function addSec(){const g=qG(),k=$('nsec').value;let name,key=k;if(k==='__custom'){name=$('nsecn').value.trim();if(!name)return toast('Skriv ett namn på sektionen');key='c'+Date.now()}else name=trs(TP.SEC(g.ind,k).n);

   <div class="card"><h2>2. Nivå</h2>${d.level?`<span class="lvl" style="background:#FFF6DD;color:#1E3A8A">ScanSay ${L[d.level]} ${new Date(NOW).getFullYear()}</span>`:`<span class="lvl" style="background:var(--badbg);color:var(--bad)">Inte ännu</span>`}
    <div class="crit">${req.map(([a,b,ok])=>`<div><span>${ok?'✓':'○'} ${a}</span><b>${b}</b></div>`).join('')}</div>
    <div class="sub">Siffrorna räknas automatiskt från inkorgen: ett meddelande räknas som läst när det öppnats eller hanterats, och ett klagomål som löst när det markerats som löst. Intyget visar alltid de verkliga siffrorna.</div></div>
   <div class="card"><h2>3. Ladda ner och dela</h2>${d.level?`<div class="row"><button class="btn lime" onclick="certDl()">Ladda ner intyg (A4, SVG)</button><button class="btn line" onclick="certPrint()">Skriv ut eller spara som PDF</button></div>
    <div class="grid g2" style="margin-top:12px;align-items:start"><div class="socprev">${SSC.social(d)}</div><div><b>Bild för sociala medier</b><div class="sub" style="margin:4px 0 8px">1080 × 1080 px för Instagram, Facebook och LinkedIn.</div><button class="btn line" onclick="certPng()">Ladda ner bild (PNG)</button>
     <textarea class="posttxt" id="posttxt" style="margin-top:10px">${esc(SSC.TX[d.lang].post(d,pubUrl(d)))}</textarea><button class="btn sm line" onclick="copyPost()">Kopiera texten</button></div></div>`:`<div class="note warn">Intyget kan laddas ner när kraven för minst Brons är uppfyllda. Läs och lös fler meddelanden i inkorgen.</div>`}</div>
   <div class="card"><h2>4. Publicera på scansay.se</h2><div class="sub">Med ert godkännande visas intyget på en offentlig sida under ert företagsnamn, så att kunder kan se att ni tar feedback på allvar. Bara nyckeltal visas, aldrig enskilda meddelanden eller personuppgifter.</div>
    ${d.level?`<label style="display:flex;gap:8px;align-items:flex-start;margin:10px 0"><input type="checkbox" id="pubok" ${isPub?'checked disabled':''}> <span>Vi godkänner att ScanSay publicerar intyget för <b>${esc(d.group)}</b>. Vi kan ta bort publiceringen när som helst.</span></label>
    <div class="row">${isPub?`<span class="tag t-p">Publicerat ${esc(pub[d.slug].pubDate||'')}</span><a class="btn sm line" href="${pubUrl(d)}" target="_blank" rel="noopener">Visa offentlig sida</a><button class="btn sm line" onclick="certPub(true)">Uppdatera med senaste siffror</button><button class="btn sm line" onclick="certUnpub()">Ta bort publiceringen</button>`:`<button class="btn" onclick="certPub()">Publicera intyget</button>`}</div>`:`<div class="note warn" style="margin-top:10px">Publicering blir möjlig när intyget har en nivå.</div>`}</div>
  </div><div class="certprev">${SSC.svg(d)}</div></div><div id="printArea" aria-hidden="true"></div>`}
function fmtN(n){return Math.round(n).toLocaleString('sv-SE')}
function fontCss(){return [...document.querySelectorAll('style')].map(x=>x.textContent).join('').match(/@font-face\{[^}]*\}/g)?.join('')||''}
function certDl(){const d=certData();dlBlob('scansay-intyg-'+d.slug+'.svg','<?xml version="1.0" encoding="UTF-8"?>'+SSC.svg(d,{fontCss:fontCss(),url:pubUrl(d)}))}
function certPrint(){const d=certData();const pa=$('printArea');pa.innerHTML=`<div class="pst">${SSC.svg(d,{url:pubUrl(d)})}</div>`;const st=document.createElement('style');st.textContent='@page{size:A4;margin:0}';document.head.appendChild(st);try{window.print()}catch(e){toast('Utskrift blockeras här. Ladda ner i stället.')}setTimeout(()=>st.remove(),1500)}
function certPng(){const d=certData();const svg=SSC.social(d,{fontCss:fontCss()});const img=new Image();
  img.onload=async()=>{const c=document.createElement('canvas');c.width=1080;c.height=1080;c.getContext('2d').drawImage(img,0,0,1080,1080);const url=c.toDataURL('image/png');const name='scansay-intyg-'+d.slug+'.png';
    try{if(window.claude&&claude.use){const dd=await claude.use('downloads');if(dd){const b=await (await fetch(url)).blob();await dd.save({filename:name,data:b});toast('Sparad: '+name);return}}}catch(e){}
    try{const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Nedladdning startad')}catch(e){toast('Nedladdning blockeras här')}};
  img.onerror=()=>toast('Bilden kunde inte skapas');img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function copyPost(){const t=$('posttxt');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Texten är kopierad'),()=>{document.execCommand('copy');toast('Texten är kopierad')})}catch(e){document.execCommand('copy');toast('Texten är kopierad')}}
function certPub(upd){if(!upd&&!$('pubok').checked)return toast('Kryssa i godkännandet först');const d=certData();const p=pubGet();const ds=new Date().toLocaleDateString('sv-SE');
  const sv=SSC.compute(S.fb.filter(f=>f.g===(SC!=='all'?SC:(CERT.g&&G(CERT.g)?CERT.g:S.groups[0].id))),{company:d.company,group:d.group,industry:d.industry,months:CERT.months,lang:'sv',now:NOW}),
        en=SSC.compute(S.fb.filter(f=>f.g===(SC!=='all'?SC:(CERT.g&&G(CERT.g)?CERT.g:S.groups[0].id))),{company:d.company,group:d.group,industry:d.industry,months:CERT.months,lang:'en',now:NOW});
  p[d.slug]={sv,en,pubDate:ds,ind:d.industry};pubSet(p);render();toast(upd?'Den offentliga sidan är uppdaterad':'Intyget är publicerat på scansay.se')}
function certUnpub(){const d=certData();const p=pubGet();delete p[d.slug];pubSet(p);render();toast('Publiceringen är borttagen')}
function gdpr(){const hits=LK?S.fb.filter(f=>f.email.startsWith(LK.slice(0,1))).length:0;
  return `<h1>GDPR</h1><div class="sub" style="margin-bottom:12px">Ni är personuppgiftsansvariga, ScanSay är biträde</div>
  <div class="grid g2">
   <div class="card"><h2>Lagringstid</h2><div class="row"><select onchange="S.retention=+this.value;save();toast('Sparat')">${[6,12,18,24].map(n=>`<option ${S.retention===n?'selected':''} value="${n}">${n} månader</option>`).join('')}</select><span class="sub">Därefter raderas e-post och namn automatiskt. Anonym statistik finns kvar.</span></div>
    <h2 style="margin-top:18px">Underbiträden</h2><table><tbody><tr><td>Drift och lagring</td><td>EU</td></tr><tr><td>E-post och SMS</td><td>EU-baserad leverantör</td></tr><tr><td>Svarsförslag</td><td>EU</td></tr></tbody></table></div>
   <div class="card"><h2>Registerförfrågan</h2><div class="row"><input type="email" id="lk" placeholder="kundens@mail.se" value="${esc(LK)}" style="flex:1"><button class="btn line" onclick="LK=$('lk').value.trim();render()">Sök</button></div>
    ${LK?`<div class="note info" style="margin-top:10px">${hits} meddelanden hittade (exempel).</div><div class="row" style="margin-top:10px"><button class="btn sm line" onclick="toast('Export skapad (förhandsvisning)')">Exportera kopia</button><button class="btn sm" style="background:#b4381c" onclick="LK='';render();toast('Personuppgifter raderade (förhandsvisning)')">Radera personuppgifter</button></div>`:''}
    <div class="sub" style="margin-top:10px">Svara inom en månad. Kunden verifierar sin e-post innan begäran behandlas.</div></div>
  </div>`;
}
render();
</script>

</style><style id="dash-fix2">.logo .wm{display:inline-flex!important;align-items:center;gap:0;font-size:22px!important;line-height:1}.logo .wm svg{width:32px!important;height:32px!important;flex:none;margin:0 9px 0 0}.logo .wm>span:not(.say){color:#fff!important;background:none!important;-webkit-text-fill-color:#fff!important}.logo .wm>.say{color:#3B82F6!important;-webkit-text-fill-color:#3B82F6!important;background:none!important}.kpi small{display:block;padding-right:46px}</style><script id="navfit">(function(){function f(){var h=document.querySelector("header"),n=document.getElementById("nav");if(!h||!n)return;if(getComputedStyle(n).position==="fixed")n.style.setProperty("top",h.getBoundingClientRect().height+"px","important");else n.style.removeProperty("top")}addEventListener("load",f);addEventListener("resize",f);setTimeout(f,300);setInterval(f,2000)})();</script></body>
