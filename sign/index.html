<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Signera avtal · ScanSay</title><link rel="icon" href="../brand/scansay-icon.svg">
<style>
@font-face{font-family:J;src:url(../fonts/jakarta-400.woff2) format("woff2");font-weight:400}@font-face{font-family:J;src:url(../fonts/jakarta-700.woff2) format("woff2");font-weight:700}@font-face{font-family:J;src:url(../fonts/jakarta-800.woff2) format("woff2");font-weight:800}
*{box-sizing:border-box}body{margin:0;background:#F5F7FB;color:#0A0F1C;font:15px/1.55 J,system-ui,sans-serif}
.top{background:#fff;border-bottom:1px solid #E5E7EB;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}.top b{font-size:20px;letter-spacing:-.03em}.top b span{color:#1D4ED8}
.top .s{font-size:13px;color:#374151;display:flex;align-items:center;gap:6px}
.wrap{max-width:880px;margin:24px auto;padding:0 16px}
.banner{background:#FEF9C3;border:1px solid #FDE047;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.err{background:#FEE2E2;border:1px solid #FCA5A5;border-radius:10px;padding:14px;font-weight:700}
.box{background:#fff;border:1px solid #E5E7EB;border-radius:14px;padding:26px;margin-top:18px}
h1{font-size:26px;letter-spacing:-.03em;margin:0 0 6px}label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input[type=text],input[type=email]{width:100%;font:inherit;border:1px solid #D1D5DB;border-radius:10px;padding:11px 12px;background:#fff;color:#0A0F1C}input:focus{outline:0;border-color:#1D4ED8;box-shadow:0 0 0 3px rgba(29,78,216,.15)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.ck{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:10px 0;padding:10px 12px;border:1px solid #E5E7EB;border-radius:10px;cursor:pointer}
.ck input{width:18px;height:18px;margin-top:2px;accent-color:#1D4ED8;flex:none}.ck.on{border-color:#1D4ED8;background:#EFF6FF}
.sigprev{margin-top:10px;border-bottom:1px solid #0A0F1C;min-height:48px;font-family:"Brush Script MT","Segoe Script",cursive;font-size:30px;color:#1D4ED8;display:flex;align-items:flex-end}
button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:14px 20px;background:#1D4ED8;color:#fff;cursor:pointer;width:100%;margin-top:18px;font-size:16px}button:disabled{background:#9CA3AF;cursor:not-allowed}
.small{font-size:12.5px;color:#4B5563}.ok{background:#DCFCE7;border:1px solid #86EFAC;border-radius:14px;padding:22px}.ok h1{color:#166534}
table.r{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:10px}table.r td{border:1px solid #E5E7EB;padding:7px 9px}
@media (max-width:640px){.grid{grid-template-columns:1fr}.box{padding:18px}#choose{grid-template-columns:1fr!important}}
@media print{.top,.box.f,.banner{display:none}body{background:#fff}}
</style><link rel="stylesheet" href="../fonts.css">
<style>body,button,input,select,textarea{font-family:var(--font)!important}h1,h2,h3{font-family:var(--font-h)!important}</style>
</head>
<body><div class="top"><b>Scan<span>Say</span></b><span class="s">🔒 Säker signering</span></div>
<div class="wrap" id="app"><p>Laddar avtalet…</p></div>
<script src="../legal/contract.js"></script>
<script>
const q=new URLSearchParams(location.search),T=q.get('t'),DEMO=q.get('demo')==='1',app=document.getElementById('app');
const esc=SSContract.esc;let O=null,BASE=null,CH=-1,ST='sent',NOTE='';
function choose(i){CH=i;O=Object.assign({},BASE,BASE.options[i]);delete O.options;draw();const el=document.getElementById('pk');if(el)el.scrollIntoView({block:'start'})}
function optCards(){if(!BASE||!BASE.options||!BASE.options.length||ST!=='sent')return '';const per=x=>x.interval==='year'?'år':'mån';
  return `<div class="box" id="pk" style="margin-top:14px"><h1 style="font-size:22px">Välj paket</h1><p class="small">ScanSay har skickat ${BASE.options.length} alternativ. Välj det som passar er – offerten nedan visas för det paket ni väljer.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px">${BASE.options.map((o,i)=>{const r=o.roles||{},tot=Object.values(r).reduce((a,b)=>a+(+b||0),0);return `<button type="button" onclick="choose(${i})" style="margin:0;text-align:left;background:${CH===i?'#EFF6FF':'#fff'};color:#0A0F1C;border:2px solid ${CH===i?'#1D4ED8':'#E5E7EB'};font-weight:400"><b style="font-size:17px">${esc(o.label||SSContract.PLAN_NAMES[o.plan]||o.plan)}</b><div style="font-size:22px;font-weight:800;margin-top:4px">${SSContract.kr(o.price)}<span style="font-size:13px;font-weight:600"> /${per(o)}</span></div><div class="small" style="margin-top:6px">${tot?1+tot+' inloggningar':''}${o.kind==='group'?' · upp till '+(o.children||0)+' dotterbolag':''}${o.interval==='year'?' · 2 mån gratis':''}</div>${CH===i?'<div style="margin-top:6px;color:#1D4ED8;font-weight:800;font-size:13px">✓ Valt</div>':''}</button>`}).join('')}</div></div>`}
function decodeDemo(t){const s=t.replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(s))))}
async function load(){
  if(!T){app.innerHTML='<div class="err">Länken saknar avtal. Använd länken i mejlet från ScanSay.</div>';return}
  try{if(DEMO){O=decodeDemo(T)}else{const r=await fetch('../api/offer?t='+encodeURIComponent(T));const j=await r.json();if(!r.ok)throw new Error(j.error||'Fel');O=j.offer;ST=j.status||'sent';NOTE=j.note||''}}
  catch(e){app.innerHTML='<div class="err">'+esc(e.message||'Länken är ogiltig.')+'</div>';return}
  if(O&&O.options&&O.options.length){BASE=O;CH=0;O=Object.assign({},BASE,BASE.options[0]);delete O.options}
  draw()}
function draw(){const c=O.customer||{},card=O.method==='stripe',per=O.interval==='year'?'år':'månad';
  app.innerHTML=`<style>${SSContract.CSS}</style>${DEMO?'<div class="banner"><b>Demo.</b> Den här signeringen sparas inte. När servern är kopplad skickas ett signerat exemplar till båda parter.</div>':''}
  <h1>Granska offerten</h1><p class="small">Läs igenom offerten och villkoren. Ni kan signera direkt, be om ändringar eller tacka nej längst ner.</p>
  ${NOTE?`<div class="box" style="margin-top:12px;border-left:5px solid #C8F542"><b>Meddelande från ScanSay</b><p style="margin:6px 0 0;white-space:pre-wrap">${esc(NOTE)}</p></div>`:''}
  ${ST!=='sent'?`<div class="ok" style="margin:14px 0;${ST==='signed'?'':'background:#FFF7ED;border-color:#FED7AA'}"><h1 style="font-size:20px;${ST==='signed'?'':'color:#9A3412'}">${ST==='signed'?'Offerten är redan signerad.':ST==='changes'?'Ni har bett om ändringar.':'Ni har tackat nej till offerten.'}</h1><p>${ST==='signed'?'Vi aktiverar kontot och skickar inloggningen per e-post.':ST==='changes'?'Vi går igenom era önskemål och skickar en uppdaterad offert, oftast inom en arbetsdag.':'Tack för beskedet. Hör av er till hello@scansay.se om ni ändrar er.'}</p></div>`:''}
  ${optCards()}${SSContract.offer(O)}
  ${ST!=='sent'?'':`<div class="box" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px" id="choose"><button type="button" style="margin:0" onclick="pick('sign')">✍️ Signera avtalet</button><button type="button" style="margin:0;background:#fff;color:#0A0F1C;border:1px solid #D1D5DB" onclick="pick('changes')">Jag vill ändra något</button><button type="button" style="margin:0;background:#fff;color:#4B5563;border:1px solid #E5E7EB" onclick="pick('decline')">Inte intresserad</button></div>`}
  <form class="box f" id="f" novalidate hidden><h1 style="font-size:22px">Signera för ${esc(c.name)}</h1>
   <div class="grid"><div><label for="nm">Ditt fullständiga namn</label><input type="text" id="nm" autocomplete="name" required></div><div><label for="ti">Titel</label><input type="text" id="ti" placeholder="t.ex. VD eller hotellchef" required></div>
   <div><label for="em">E-post för kvitto</label><input type="email" id="em" autocomplete="email" value="${esc(c.email||'')}" required></div><div><label for="org">Organisationsnummer</label><input type="text" id="org" value="${esc(c.org||'')}" placeholder="556677-1122"></div></div>
   <label class="ck"><input type="checkbox" id="c1"> <span>Jag har läst och godkänner offerten och ScanSays allmänna villkor (version ${SSContract.VERSION}).</span></label>
   <label class="ck"><input type="checkbox" id="c2"> <span>Jag godkänner personuppgiftsbiträdesavtalet.</span></label>
   <label class="ck"><input type="checkbox" id="c3"> <span>${card?`Jag godkänner att kortet debiteras ${SSContract.kr(O.price)} exkl. moms i förskott och därefter automatiskt varje ${per} tills avtalet sägs upp enligt villkoren.`:`Jag godkänner betalning mot faktura, ${SSContract.kr(O.price)} exkl. moms per ${per}, i förskott med ${O.invoiceDays||30} dagars betalningsvillkor.`}</span></label>
   <label class="ck"><input type="checkbox" id="c4"> <span>Jag är behörig att ingå avtal för ${esc(c.name)} och avtalet ingås i företagets verksamhet.</span></label>
   <label>Signatur</label><div class="sigprev" id="sp"></div><p class="small">Din signatur skapas från namnet ovan. Vi sparar namn, titel, e-post, IP-adress, tidpunkt och en kontrollsumma av avtalet som bevis.</p>
   <button type="submit" id="btn" disabled>Signera avtalet</button><p class="small" id="msg" role="status"></p></form>
  ${ST!=='sent'?'':`<form class="box f" id="fc" hidden novalidate><h1 style="font-size:22px">Vad vill ni ändra?</h1><p class="small">Beskriv vad ni vill ändra, till exempel pris, antal platser, betalsätt eller vad som ingår. Vi skickar en uppdaterad offert.</p>
   <label for="cm">Era önskemål</label><textarea id="cm" rows="5" style="width:100%;font:inherit;border:1px solid #D1D5DB;border-radius:10px;padding:11px 12px" placeholder="T.ex. Vi vill ha 45 rum i stället för 60 och betala per år."></textarea>
   <label for="cp">Önskat pris (valfritt)</label><input type="text" id="cp" placeholder="T.ex. 4 500 kr per månad">
   <button type="submit">Skicka önskemål</button><p class="small" id="cmsg" role="status"></p></form>
  <form class="box f" id="fd" hidden novalidate><h1 style="font-size:22px">Inte intresserad</h1><p class="small">Tack för att ni tittade på offerten. Berätta gärna varför, så blir vi bättre (valfritt).</p>
   <textarea id="dm" rows="3" style="width:100%;font:inherit;border:1px solid #D1D5DB;border-radius:10px;padding:11px 12px" placeholder="T.ex. för dyrt just nu, eller vi har redan ett system."></textarea>
   <button type="submit" style="background:#374151">Tacka nej</button><p class="small" id="dmsg" role="status"></p></form>`}`;
  const fc=document.getElementById('fc'),fd=document.getElementById('fd');
  if(fc)fc.addEventListener('submit',e=>{e.preventDefault();respond('changes',document.getElementById('cm').value,document.getElementById('cp').value,'cmsg')});
  if(fd)fd.addEventListener('submit',e=>{e.preventDefault();respond('decline',document.getElementById('dm').value,'','dmsg')});
  const f=document.getElementById('f'),btn=document.getElementById('btn'),ids=['c1','c2','c3','c4'];
  const chk=()=>{ids.forEach(i=>document.getElementById(i).closest('.ck').classList.toggle('on',document.getElementById(i).checked));document.getElementById('sp').textContent=document.getElementById('nm').value;btn.disabled=!(ids.every(i=>document.getElementById(i).checked)&&document.getElementById('nm').value.trim().length>2&&document.getElementById('ti').value.trim().length>1&&/^\S+@\S+\.\S+$/.test(document.getElementById('em').value))};
  f.addEventListener('input',chk);f.addEventListener('change',chk);
  f.addEventListener('submit',async e=>{e.preventDefault();if(btn.disabled)return;btn.disabled=true;btn.textContent='Signerar…';
    const data={t:T,choice:CH,name:nm.value.trim(),title:ti.value.trim(),email:em.value.trim(),orgNr:org.value.trim(),accepts:{terms:c1.checked,pub:c2.checked,payment:c3.checked,business:c4.checked}};
    let rec;try{if(DEMO){rec={id:'DEMO-'+Math.random().toString(36).slice(2,8).toUpperCase(),ts:new Date().toISOString(),name:data.name,title:data.title,email:data.email,version:SSContract.VERSION,sha256:await SSContract.hash(document.querySelector('.ctr').innerText)}}
      else{const r=await fetch('../api/sign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Fel');rec=j.record}}
    catch(err){document.getElementById('msg').textContent=err.message;btn.disabled=false;btn.textContent='Signera avtalet';return}
    done(rec,data)})}
function pick(k){['f','fc','fd'].forEach(id=>{const el=document.getElementById(id);if(el)el.hidden=!(id===({sign:'f',changes:'fc',decline:'fd'})[k])});const el=document.getElementById(({sign:'f',changes:'fc',decline:'fd'})[k]);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
async function respond(action,message,price,mid){const m=document.getElementById(mid);if(action==='changes'&&String(message).trim().length<5){m.textContent='Skriv vad ni vill ändra.';return}
  m.textContent='Skickar…';try{if(!DEMO){const r=await fetch('../api/offer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t:T,action,message:(BASE&&CH>=0?'[Paket: '+(BASE.options[CH].label||BASE.options[CH].plan)+'] ':'')+message,price})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Fel')}}catch(e){m.textContent=e.message;return}
  ['choose','f','fc','fd'].forEach(id=>{const el=document.getElementById(id);if(el)el.remove()});
  app.insertAdjacentHTML('beforeend',`<div class="ok" style="margin-top:18px;${action==='decline'?'background:#F3F4F6;border-color:#E5E7EB':''}"><h1 style="${action==='decline'?'color:#111827':''}">${action==='decline'?'Tack för beskedet.':'Tack! Vi har fått era önskemål.'}</h1><p>${action==='decline'?'Hör gärna av er om ni ändrar er.':'Vi skickar en uppdaterad offert, oftast inom en arbetsdag.'}${DEMO?' (Demo: inget skickades.)':''}</p></div>`);document.querySelector('.ok:last-child').scrollIntoView({behavior:'smooth',block:'center'})}
function done(r,d){const slot=document.querySelector('[data-sign-slot]');if(slot){slot.classList.remove('ctr-empty');slot.innerHTML='<span class="ctr-signed">'+esc(d.name)+'</span>'}const m=document.querySelector('[data-sign-meta]');if(m)m.textContent=d.name+', '+d.title+' · '+r.ts.slice(0,10);
  document.getElementById('f').outerHTML=`<div class="ok"><h1>Tack! Avtalet är signerat.</h1><p>${DEMO?'Demo: inget skickades.':'Ett signerat exemplar har skickats till '+esc(d.email)+'.'} ${O.method==='stripe'?'Ni får strax en säker betalningslänk från Stripe för att lägga in kortet.':'Fakturan skickas till er e-post.'}</p>
  <table class="r"><tr><td><b>Signerings-id</b></td><td>${esc(r.id)}</td></tr><tr><td><b>Tidpunkt</b></td><td>${esc(r.ts)}</td></tr><tr><td><b>Signerat av</b></td><td>${esc(r.name)}, ${esc(r.title)}</td></tr><tr><td><b>Avtalsversion</b></td><td>${esc(r.version)}</td></tr><tr><td><b>Kontrollsumma</b></td><td style="word-break:break-all">${esc(r.sha256||'')}</td></tr></table>
  <button onclick="print()" style="background:#0A0F1C">Skriv ut eller spara som PDF</button></div>`;document.querySelector('.ok').scrollIntoView({behavior:'smooth',block:'center'})}
load();
</script></body></html>
